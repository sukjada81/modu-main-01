<!doctype html> 
<html lang="ko">

<head>
	<title>비밀번호 확인</title>
	
	<link rel="StyleSheet" href="../managers/common/style.css?ver={{ver}}" type="text/css" title="style" />
	<link type="text/css" rel="stylesheet" href="//cdn.jsdelivr.net/npm/xeicon@2.3.3/xeicon.min.css" />
	<link type="text/css" rel="stylesheet" href="../lib/alertify.css?ver={{ver}}" />
	
	<script src="//code.jquery.com/jquery-3.3.1.min.js"></script>
	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>
	<script src="../lib/jquery-ui.js?ver={{ver}}"></script>
	<script src="../lib/jquery.heapbox.js?ver={{ver}}"></script>
	<script src="../lib/alertify.js?ver={{ver}}"></script>
	
	<script src="../lib/clipboard.js?ver={{ver}}"></script>
	<script src="../lib/lib.Function.js?ver={{ver}}"></script>
	<script src="../lib/lib.CheckForm.js?ver={{ver}}"></script>	

</head> 

<script>
<!--

alertify.defaults.glossary.title = "{{SERVER_NAME}}";

// -->
</script>

<body style="min-width:600px; background-color:#fff;">
	<center style="padding:20px 0;" class="board_passwd">
		<form name='passwdForm' method='post' action='{{ACTION}}' target='{{target}}'>
		<!-- DYNAMIC @is_post@ -->
		<input type="hidden" name="b_id" value="{{b_id}}" />
		<input type="hidden" name="b_mode" value="{{type}}" />
		<input type="hidden" name="uid" value="{{uid}}" />
		<input type="hidden" name="c_uid" value="{{c_uid}}" />
		<input type="hidden" name="vendor" value="1" />
		<!-- DYNAMIC @is_post@ -->
		<div class="loginBox" style="padding-bottom:10px">	
			<div class="inputBox">
				<ul>	
					<li class="alignLeft fontSCDream">
						<input type='text' name='subject' value="{{SUBJECT}}" readonly data-title="{{TTL}}" />
					</li>					
				</ul>		
			</div>		
		</div>

		<div class="btnShineBox" style="background:#fff; padding-top:0">
			<div class="displayInline"><button class="fontSCDream weight300 shine black" type="submit">확인</button></div>		
		</div>
		</form>
	</center>
</body>
</html>

<iframe name="HFrm" style="display:none;"></iframe>
