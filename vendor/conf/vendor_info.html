<form name='signForm' method='post' action='vendor_post.php' enctype="multipart/form-data" target='HFrm'>
<input type="hidden" name="mode" value="modify" />
<input type="hidden" name="img_del1" value="" />
<input type="hidden" name="img_del2" value="" />

<div class="content">

	<div class="contentTitle">
		<i class="xi-file-text xi-x"></i>&nbsp;&nbsp;업체 기본 정보
	</div>

	<table>
	<colgroup>
	<col width="16%" /> 
	<col width="34%" />
	<col width="16%" /> 
	<col width="34%" />	
	</colgroup>	
	<tr> 
		<td>아이디 <i class="xi-help xi-x colorDGary masterTooltip" title="영문시작, 영소문자, 숫자 조합 6~12자만 가능합니다."></i></td>
		<td colspan="3">{{id}}</td>	
	</tr>	
	<tr> 
		<td>승인상태</td>
		<td>
			{{auth}}
		</td>		
		<td>판매상태<i class="xi-help xi-x colorDGary masterTooltip" title="판매허용일 경우에만 상품이 쇼핑몰에 노출이되며 판매준비, 판매중지일 경우 상품이 쇼핑몰에 노출되지 않습니다."></i></td>
		<td>
			{{sell}}
		</td>		
	</tr>
	<tr> 
		<td>상품승인<i class="xi-help xi-x colorDGary masterTooltip" title="관리자 수동승인일 경우 판매자 상품등록/수정시 쇼핑몰에 노출이 되지 않으며 관리자가 승인 처리 해 줘야만 쇼핑몰에 노출이 됩니다."></i></td>
		<td colspan="3">
			{{goods_auth}}
		</td>	
	</tr>
	<tr> 
		<td>배송주체 <i class="xi-help xi-x colorDGary masterTooltip" title="판매자 배송일경우 판매자의 배송정책이 적용되며 본사배송일 경우 본사상품과 동일하게 본사 배송정책이 적용 됩니다."></i></td>
		<td colspan="3">
			{{delivery_type}}
		</td>	
	</tr>
	<tr> 
		<td>판매수수료율 <i class="xi-help xi-x colorDGary masterTooltip" title="판매금액 기준 판매시 수수료율입니다. 판매자에게 판매수수료를 제외한 금액을 정산합니다. 소수 2자리까지 가능 합니다."></i></td>
		<td>{{commission}}%</td>
		</td>	
		<td>정산주기 <i class="xi-help xi-x colorDGary masterTooltip" title="정산주기는 월1 ~ 4회 가능 합니다."></i></td>
		<td>
			{{account_cycle}}				
		</td>	
	</tr>
	<tr> 
		<td>정산계좌정보</td>
		<td colspan="3">
			<input type='text' name='bank_name' value='{{bank_name}}' placeholder="은행명" style="width:25%" />
			<input type='text' name='bank_num' value='{{bank_num}}' placeholder="계좌번호" style="width:25%" />
			<input type='text' name='bank_owner' value='{{bank_owner}}' placeholder="예금주" style="width:25%" />		
		</td>		
	</tr>
	<tr> 
		<td>첨부 이미지</td>
		<td colspan="3">
			<table class="listIn">
			<colgroup>
			<col width="50%" /> 
			<col width="50%" /> 
			</colgroup>
			<thead>
			<tr> 
				<th>사업자등록증사본</th>
				<th>통장사본</th>
			</tr>
			</thead>
			<tbody class="imageUP">
			<tr>
				<td>
					<button class="fileinput-button btns" type="button">
						<span class="text"><i class="fas fa-upload"></i> 이미지 업로드</span>				
						<input type="file" name="image1" class="imageBtn" num="1" />
					</button>
					<button class="filedel-button btns" type="button" id="imageDel1">
						<span class="text"><i class="xi-close"></i> 이미지 삭제</span>
					</button>
				</td>
				<td>
					<button class="fileinput-button btns" type="button">
						<span class="text"><i class="fas fa-upload"></i> 이미지 업로드</span>				
						<input type="file" name="image2" class="imageBtn" num="2" />
					</button>
					<button class="filedel-button btns" type="button" id="imageDel2">
						<span class="text"><i class="xi-close"></i> 이미지 삭제</span>
					</button>
				</td>
			</tr>
			<tr id="uploadImage">
				<td id="imgWidth">
					<img id="image1" alt="사업자등록증사본 업로드" src="../common/img/blank.gif" />
				</td>
				<td>
					<img id="image2" alt="통장사본 업로드" src="../common/img/blank.gif" />
				</td>
			</tr>
			</tbody>
			</table>
					
		</td>
	</tr>	
	</table>

	<div class="empty60"></div>

	<div class="contentTitle">
		<i class="xi-file-text xi-x"></i>&nbsp;&nbsp;업체 정보 및 담당자 정보
	</div>

	<table>
	<colgroup>
	<col width="16%" /> 
	<col width="34%" />
	<col width="16%" /> 
	<col width="34%" />	
	</colgroup>
	<tr> 
		<td>업체명</td>
		<td><input type='text' name='comp_name' value='{{comp_name}}' required="required" data-msg="상호(업체명)을" /></td>
		<td>대표자명</td>
		<td><input type='text' name='comp_owner' value='{{comp_owner}}' required="required" data-msg="대표자명을" /></td>
	</tr>
	<tr> 
		<td>사업자등록번호</td>
		<td colspan="3"><p style="position:relative"><input type='text' name='comp_license_no' value='{{comp_license_no}}' style="width:98%" placeholder="예) 100-20-30000" required="required" data-msg="사업자등록번호를" /></p></td>		
	</tr>
	<tr> 
		<td>사업자 업태</td>
		<td><input type='text' name='comp_type' value='{{comp_type}}' /></td>
		<td>사업자 종목</td>
		<td><input type='text' name='comp_item' value='{{comp_item}}' /></td>
	</tr>
	<tr> 
		<td>사업장 주소</td>
		<td colspan="3">
			<div style="position:relative"><input type='text' name='comp_postcode_search' style="width:98%" placeholder="경대로 144 (도로명 + 건물번호) or 신암동 645-1 (지역명(동/리) + (번지, 건물명, 아파트명)) + 엔터키" data-zip-search='1' /></div>
			<div class="empty10"></div>
			<input type='text' name='comp_postcode' value='{{comp_postcode}}' style="width:10%" placeholder="우편번호" />
			<input type='text' name='comp_address1' value='{{comp_address1}}' style="width:42%" placeholder="사업장 주소" required="required" data-msg="사업장주소를" />
			<input type='text' name='comp_address2' value='{{comp_address2}}' style="width:43%" placeholder="사업장 상세주소" />
		</td>
	</tr>	
	<tr> 
		<td>대표이메일</td>
		<td colspan="3"><p style="position:relative"><input type='text' name='comp_email' value='{{comp_email}}' style="width:98%" required="required" data-msg="대표이메일을" data-check-email='1' /></p></td>
	</tr>
	<tr> 
		<td>대표전화</td>
		<td><input type='text' name='comp_tel' value='{{comp_tel}}' placeholder="예) 02-0000-0000" data-msg="대표전화번호를" required="required" /></td>
		<td>대표팩스</td>
		<td><input type='text' name='comp_fax' value='{{comp_fax}}' placeholder="예) 02-0000-0000" data-msg="대표팩스번호를" required="required" /></td>
	</tr>
	<tr> 
		<td>담당자명</td>
		<td><input type='text' name='cont_name' value='{{cont_name}}' /></td>
		<td>담당자 번호</td>
		<td><input type='text' name='cont_cell' value='{{cont_cell}}' placeholder="예) 010-0000-0000" /></td>
	</tr>
	<tr> 
		<td>담당자 이메일</td>
		<td colspan="3"><p style="position:relative"><input type='text' name='cont_email' value='{{cont_email}}' style="width:98%" data-check-email='1' /></p></td>
	</tr>
	<tr> 
		<td>담당자 부서</td>
		<td><input type='text' name='cont_part' value='{{cont_part}}' placeholder="예) 영업부" /></td>
		<td>담당자 직위</td>
		<td><input type='text' name='cont_position' value='{{cont_position}}' placeholder="예) 과장" data-on-enter="1" /></td>
	</tr>

	</table>		

	<div class="empty60" ></div>

	<div class="btnSubmitBox">
		<div class="displayInline"><button class="weight300 shine" type="submit">업체정보 수정하기</button></div>
		<div class="btnPrev"><i class="xi-arrow-left xi-x"></i></div>
		<div class="btnPrevTitle">이전페이지</div>		
	</div>

</div>

</form>

<script src="https://ssl.daumcdn.net/dmaps/map_js_init/postcode.v2.js"></script>
<script>
<!--

	function putImage(num, vls, size) {
		if(vls) {
			$("#uploadImage").show();

				$("#image"+num).css({'width':'95%'});
			}
			else $("#image"+num).css({'width':size});

			$("#imageDel"+num).css({opacity:0.1, display:"inline-block"}).stop().animate({width:'show', opacity:1.0}, 'fast');
		}	
		else {
			if($("#imageDel"+num).css('display')!='none') {

				$("#image"+num).css({'width':'1'});
				$("#imageDel"+num).animate({width:'hide'}, 'fast');
				eval("form.image"+num).value = '';
			}
		}
	}
	
	$(function() {
		
		zipSearch('comp');

		$('.imageBtn').on('change', function(e){	
			
			if(!CommonCheckImage($(this))) return;

			if(e.target.files[0]) {
				var num = $(this).attr("num");
				var reader = new FileReader();
				reader.onload = function (e) {
					var image = new Image();
					image.src = e.target.result;

					image.onload = function(){
						$("#uploadImage").show();
						$("#image"+num).attr("src", this.src);

						if(parseInt($("#imgWidth").css('width')) < parseInt(this.width)) {
							$("#image"+num).css({'width':'95%'});
						}
						else $("#image"+num).css({'width':this.width});

						$("#imageDel"+num).css({opacity:0.1, display:"inline-block"}).stop().animate({width:'show', opacity:1.0}, 'fast');
			        };                      
				}
				reader.readAsDataURL(e.target.files[0]);
			}
		});

		$('.filedel-button').on('click', function(e){		
			var num = str_replace("imageDel","",this.id);
			$("#image"+num).attr("src", "../common/img/blank.gif");
			$("#image"+num).css({'width':'1'});
			$("#imageDel"+num).animate({width:'hide'}, 'fast');
			eval("document.signForm.img_del"+num).value = 1;
		});

		<!-- DYNAMIC @loop_image@ -->
		putImage({{i}}, '{{image}}', '{{size}}')	
		<!-- DYNAMIC @loop_image@ -->	

		resetContent();

	});

//-->
</script>
