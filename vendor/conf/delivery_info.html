	function deliveryConfInsert(uid) {	
		var num = $("#deliveryConf tbody tr").length + 1; 
		var insertCode = '	<tr id="dconf_'+uid+'">';
		insertCode += '			<td>'+num+'</td>';
		insertCode += '			<td>'+$('form[name=deliveryConfForm] input[name=area1]').val() + $('form[name=deliveryConfForm] input[name=area2]').val() + '</td>';
		insertCode += '			<td>'+number_format($('form[name=deliveryConfForm] input[name=price]').val()) + '원</td>';

		$("#deliveryConf tbody").append(insertCode);

		$(".emptyList").hide();

	function deliveryConfReset() {
		resetTooltip();
		defInit();				
	}
	
	function defInit(uid) {		
		
		$('.dconfDel').unbind('click').bind('click',function(e) {	
			var f = document.deliveryConfForm2;
			var uid = $(this).attr("data-uid");
			var secNum = $(this).parent('td').parent('tr').children('td:nth-child(1)').text();
			if(!secNum) return;

			$(this).parent('td').parent('tr').remove();
						
			$("#deliveryConf tbody tr td:nth-child(1)").text(function() {
				if(secNum < $(this).text()) return parseInt($(this).text()) - 1;
				else return $(this).text();
			});

			fancyTableObj.tableSort(fancyElm);
			fancyTableObj.tableUpdate(fancyElm);	

			f.mode2.value = "del";
			f.uid.value = uid;
			f.submit();
		});
		

		$('.dconfUsed').unbind('click').bind('click',function(e) {	
			var f = document.deliveryConfForm2;
			var uid = str_replace("used","",$(this).attr("name"));
			f.mode2.value = "mod";
			f.uid.value = uid;
			f.used.value = $('input[name=used'+uid+']:checked').val();
			f.submit();							
		});
	}

	function ckDeliveryType() {

		var nameArr = new Array('delivery_p_price1','delivery_p_price2');

		if($('input[name=delivery_type]:checked').val()=='D') {
			dipslayDarkShow('form[name=deliveryForm] input[name=delivery_d_price]');
		}
		else {
			dipslayDarkHide('form[name=deliveryForm] input[name=delivery_d_price]');;					
		}

		if($('input[name=delivery_type]:checked').val()=='P') {
			for(i=0;i<nameArr.length;i++) {
				dipslayDarkShow('form[name=deliveryForm] input[name='+nameArr[i]+']');
			}
			resetTooltip();
		}
		else {
			for(i=0;i<nameArr.length;i++) {
				dipslayDarkHide('form[name=deliveryForm] input[name='+nameArr[i]+']');
			}		
		}
	}

	$(function() {

		<!-- DYNAMIC @loop_delivery@ -->
		$("#deliverySortable").multiBox('add', [{'name' : 'delivery_num', 'value' : '{{delivery_num}}'},{'name' : 'delivery_name', 'value' : '{{delivery_name}}'},{'name' : 'delivery_url', 'value' : '{{delivery_url}}'},{'name' : 'delivery_used', 'value' : '{{delivery_used}}'}]);
		<!-- DYNAMIC @loop_delivery@ -->

		$('form[name=deliveryForm] input[name=delivery_type]').click(function(e){
			ckDeliveryType();
		});	

		$(".imAreasMod").click(function(e){
			var f2			= document.deliveryImForm;			
			var num			= $(this).attr("data-uid");
			f2.num.value	= num;
			f2.used.value	= $('input[name=delivery_im_areas'+num+'_used]:checked').val();
			f2.price.value	= $('input[name=delivery_im_areas'+num+'_price]').val();
			f2.submit();		
		});

		$(".btnImList").click(function(e){
			iframeWidth = '1058px';
			iframeHeight = '.8';
			iframeView("popup_delivery_im_list.php", "제주도외 도서산간지역 설정");
		});
		
		ckDeliveryType(); 
		only_num_formatCk();
		zipSearch2('area1');		
		defInit();
	});
