<script>

	var goods_price_limit1  = '{{goods_price_limit1}}';
	var goods_price_limit2  = '{{goods_price_limit2}}';

	function vendorPrice1(uid) {
		var price = parseInt(str_replace(",","",$('form[name=listForm] input[name=price_'+uid+']').val()));			
		if(price > 0) {
			var commission = $('form[name=listForm] input[name=commission_'+uid+']').val();
			var orig_price = price * ((100 - commission) / 100);
			orig_price = priceLimit2(orig_price);
			$('form[name=listForm] input[name=orig_price_'+uid+']').val(number_format(orig_price));
		}
	}

	function vendorPrice2(uid) {
		var price2 = parseInt(str_replace(",","",$('form[name=listForm] input[name=orig_price_'+uid+']').val()));			
		if(price2 > 0) {
			var commission = $('form[name=listForm] input[name=commission_'+uid+']').val();
			var price = (price2 * 100) / (100 - commission);
			price = priceLimit2(price);
			$('form[name=listForm] input[name=price_'+uid+']').val(number_format(price));		
		}
	}

	function qtyChange(uid) {
		if($('form[name=listForm] input[name=qty_type_'+uid+']').val()==1) {			
			qtyClick(uid);
		}
	}

	function qtyClick(uid) {
		var ckLimit = $('form[name=listForm] input[name=qty_type_'+uid+']');
		var ckQty	= $('form[name=listForm] input[name=qty_'+uid+']');
		var $v = $('#qty_type_'+uid); 
		if($v.hasClass('colorOrange')) {					
			ckLimit.val('0');
			ckQty.attr('readonly',false);
			ckQty.removeClass('darks');
			$v.removeClass('colorOrange');
		}
		else {
			ckLimit.val('1');
			ckQty.attr('readonly',true);					
			ckQty.addClass('darks');
			$v.addClass('colorOrange');					
		}
	}	

//-->
</script>
