<!-- DYNAMIC @is_list_area@ -->
<div>	
	<div class="widgetTitle">오늘의 상품수 <span data-id="goods"><i class="xi-renew masterTooltipWidget" title="새로고침"></i></span></div>
	<a href="../goods/goods_list.php?s_date={{today}}&e_date={{today}}">
	<div class="widgetStatistics">
		<p>{{TOTAL}}</p>
	</div>
	</a>
	<div class="widgetDetail">
		<a href="../goods/goods_list.php"><div>전체상품수 <span>{{CNT1}}</span></div></a>
		<a href="../goods/goods_list.php?soldout=1"><div>품절상품수 <span>{{CNT2}}</span></div></a>		
	</div>	
	<div style="height:0px"></div>
	<div id="chart_goods" style="width: 100%; height: 90px;"></div>	
</div>	

<script>
	
	google.charts.load('current', {'packages':['corechart']});
	google.charts.setOnLoadCallback(drawChartGoods);

	function drawChartGoods() {
		var data = google.visualization.arrayToDataTable([
			['Year', ''],
			['{{date1}}', {{value1}}],
			['{{date2}}', {{value2}}],
			['{{date3}}', {{value3}}],
			['{{date4}}', {{value4}}],
			['{{date5}}', {{value5}}]
		]);

		var options = {
			title: '',		  
			animation: { startup: true, duration: 200, easing: 'linear', },
			chartArea: {width: '100%', height: '96%', backgroundColor:'transparent', },
			pointSize: 3,
			tooltip: {  textStyle : {fontSize:12, fontColor: '#fff', fontName:'fontMontserrat' ,}, trigger: 'both', },
			hAxis: {title: '', textPosition: 'none', },
			vAxis: {minValue: 0, textPosition: 'none', gridlines : {count : 0}, baselineColor : 'transparent',},
			backgroundColor : { 'fill': 'transparent', 'opacity': 100 }, 
			colors:['#efefef'],
			legend : {position: 'top', textStyle: { fontSize: 0.1} },		  	 
		};

		var chart = new google.visualization.AreaChart(document.getElementById('chart_goods'));
		chart.draw(data, options);				
	}
</script>
<!-- DYNAMIC @is_list_area@ -->
