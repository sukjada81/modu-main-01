<style>
body { min-width:840px; background-color:#fff; }
#contentBox { min-width:840px; min-height:400px; top:20px; background-color:#fff; border:0; box-shadow: none; -webkit-box-shadow: none; }
#contentBox .content { min-width:800px; margin:20px; clear:both; }
</style>

<form name='signForm' method='post' action='popup_list_conf_post.php' target='HFrm'>					
<input type="hidden" name="type" value="{{type}}" />
<input type="hidden" name="fields_order" />

<div class="content">
	<ul id="fieldsSortable">
		<!-- DYNAMIC @loop_field@ -->
		<li data-idx="{{name}}" class="{{class}}">
			<input type="hidden" name="{{name}}_checked" value="{{checked}}" />
			{{title}}
		</li>	
		<!-- DYNAMIC @loop_field@ -->
	</ul>
</div>

<div class="btnSubmitBoxPop">
	<div class="displayInline"><button class="weight300 shine" type="submit">적용하기</button></div>		
</div>

</form>

<iframe name="HFrm" style="display:none"></iframe>

<script>

	$("#fieldsSortable").find('li').each(function(i) {

		});
	});
