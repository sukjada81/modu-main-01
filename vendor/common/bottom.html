	firebase.initializeApp({
		apiKey: "{{push_apiKey}}",
		authDomain: "{{push_authDomain}}",
		projectId: "{{push_projectId}}",
		storageBucket: "{{push_storageBucket}}",
		messagingSenderId: "{{push_messagingSenderId}}",
		appId: "{{push_appId}}"
	});
 
	const messaging = firebase.messaging();

	var notice_sound = new Audio("../../managers/common/notice.wav");
	notice_sound.loop = false; // 반복재생하지 않음	

	function sendTokenToServer(currentToken) {
		if(!isTokenSentToServer()) {
			setTokenSentToServer(true);
			sendTokenShop(currentToken);
		}

		if(checkLoginProc == 1) sendTokenShop(currentToken);		
	}

	function sendTokenShop (currentToken) {
		var data = new FormData();

		data.append('token', currentToken);

		$.ajax({
				url: '../common/push_token_json.php', 
				type: 'POST',
				data: data, 
				cache: false,
				dataType: 'json',
				processData: false, 
				contentType: false, 
				success: function(data, textStatus, jqXHR) {
					if(typeof(data.error) === 'undefined') {							
						alertify.success(data.success);
					}
					else {
						alertify.error(data.error);
					}
				},
				error: function(jqXHR, textStatus, errorThrown) {						
					alertify.error(textStatus);
				}	
			 });
	}

	function isTokenSentToServer() {
		return window.localStorage.getItem('sentToServer') === '1';
	}

	function setTokenSentToServer(sent) {
		window.localStorage.setItem('sentToServer', sent ? '1' : '0');
	}

	function requestPermission() {		
		if($('#pushCk').prop("checked")) {			
			if (!("Notification" in window)) {
				alertify.error("알림을 지원하지 않는 브라우저입니다.");
				return false;
			}

			Notification.requestPermission().then((permission) => {
				if(permission !== 'granted') {
					alertify.error("알림을 허용 해 주시기 바랍니다.");
					return false;
				} 
				else {
					getToken();
				}
			});			
		}
	}

	function getToken() {
		if($('#pushCk').prop("checked")) {
			messaging.getToken({vapidKey: '{{push_server_key2}}'}).then((currentToken) => {
				if (currentToken) {
					sendTokenToServer(currentToken);
				} 
				else {					
					setTokenSentToServer(false);
					alertify.error("알림을 사용하실 수 없습니다.");
				}
			}).catch((err) => {				
				setTokenSentToServer(false);
				alertify.error("알림을 사용하실 수 없습니다.");
			});

		}
	}
	
	messaging.onMessage((payload) => {		
		if(!document.hasFocus()) {
			Notification.requestPermission(function (permission) {
				if(permission !== 'granted') return;

				var notification = new Notification(payload.notification.title, {
					icon: '{{mobile_icon}}',
					body: payload.notification.body,
				});

				notification.onclick = function () {
					window.focus();
				};
			});
		}
		else {
			body = str_replace("\n", "<br />", payload.notification.body);
			alertify.notice(payload.notification.title + '<br />' + payload.notification.body);
		}
	});	

	var checkLoginProc = 0;
	<!-- DYNAMIC @is_login_proc@ -->
	checkLoginProc = 1;	
	requestPermission();
	<!-- DYNAMIC @is_login_proc@ -->	
//-->
</script>
