<form name='deliveryForm' method='post' action='order_post.php' enctype="multipart/form-data" target='HFrm' onsubmit="return false;">					
<input type="hidden" name="mode" value="delivery" />

<div class="content">

	<div class="contentTitle">
		<i class="xi-file-text xi-x"></i>&nbsp;&nbsp;송장번호일괄등록
	</div>

	<table>
	<colgroup>
	<col width="16%" /> 
	<col width="34%" />
	<col width="16%" /> 
	<col width="34%" />	
	</colgroup>
	<tr> 
		<td>배송업체</td>
		<td colspan="3">
			<select name="delivery" required="required" data-msg="배송업체를">
				<option value="">배송업체 선택</option>
				<!-- DYNAMIC @loop_delivery@ -->
				<option value="{{delivery_num}}">{{delivery_name}}</option>
				<!-- DYNAMIC @loop_delivery@ -->
			</select>			
			<script>
				$("form[name=deliveryForm] select[name='delivery']").val('').heapbox({'width' : '200px'});
			</script>
		</td>
	</tr>
	<tr> 
		<td>엑셀파일 등록</td>
		<td colspan="3">
			<div class="btnBox2">						
				<div id="btn_excel" class="btnBoxIcon">
					<i class="fas fa-plus-circle fa-2x"></i>											
				</div>												
				<input type="file" name="excel" class="excelBtn" required="required" data-msg="엑셀파일을" />
				<div class="excel_name"></div> 
				<div id="btn2_excel" class="btnBoxIcon2">
					<i class="fas fa-edit masterTooltip" title="변경하기"></i>
				</div>
			</div>			
		</td>
	</tr>
	<tr> 
		<td>엑셀파일 안내</td>
		<td colspan="3">
			아래 '송장번호 일괄 등록용 엑셀 다운로드'를 클릭하시면 선택된 결제완료, 배송준비중 상태의 주문상품이 엑셀로 다운로드 됩니다. <br />
			다운받으신 후 주문상품별로 송장번호를 입력 하시고 xls파일이나 xlsx파일로 저장 후 등록 하시면 됩니다. <br /> <br />
			<label><input type='checkbox' name="status1" value="1" checked="checked" /><span></span> 결제완료</label>&nbsp;&nbsp;
			<label><input type='checkbox' name="status2" value="1" checked="checked" /><span></span> 배송준비중</label>&nbsp;&nbsp;
			<button class="btns" type="button" style="width:20%" id="sampleDwon"><span class="text"><i class="xi-download xi-x"></i> 송장번호 일괄 등록용 엑셀 다운로드</span></button>
		</td>
	</tr>
	</table>

	<div class="empty60"></div>

	<div class="btnSubmitBox">
		<div class="displayInline"><button class="weight300 shine" type="submit">송장번호 일괄등록</button></div>		
	</div>	
</div>

</form>

<form name='excelForm' method='post' action='order_delivery_excel_down.php' target='HFrm'>
<input type="hidden" name="status1" value="" />
<input type="hidden" name="status2" value="" />
</form>
