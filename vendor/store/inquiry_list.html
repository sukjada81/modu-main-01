<div class="content">
	
	<form name='searchForm' method='get' action='{{PHP_SELF}}'>
	<div class="searchBox">
		<div class="floatLeft">
			<select name="field">
				<option value="multi">통합</option>
				<option value="g_name">상품명</option>
				<option value="name">이름</option>
				<option value="id">아이디</option>
			</select>			
		</div>
		<div class="searchBoxIn">
			<input type="text" name="keyword" value="{{keyword}}" data-search-btn="1" data-on-enter="1" />
			<p class="resetIcon resetIconBtn"><i class="xi-undo masterTooltip" title="초기화"></i></p>
		</div>

		<div class="expensionArrow">
			<div class="box"></div>
			<i class="xi-arrow-down box_down"></i>			
		</div>
	</div>
	<div class="searchDetail">
		<div class="searchDetailBox">
			<table class="search">
			<colgroup>
			<col width="33%" /> 
			<col width="33%" />
			<col width="33%" /> 
			</colgroup>
			<tr> 
				<td>
					<select name="cate">
						<option value="">문의종류</option>
						<!-- DYNAMIC @loop_cate@ -->
						<option value="{{cate_num}}">{{cate_name}}</option>
						<!-- DYNAMIC @loop_cate@ -->
					</select>						
				</td>			
				<td>
					<select name="answer">
						<option value="">답변</option>
						<option value="1">미답변</option>
						<option value="2">답변완료</option>
					</select>							
				</td>
				<td>
					<select name="id">
						<option value="">회원</option>
						<option value="0">비회원문의</option>
						<option value="1">회원문의</option>
					</select>						
				</td>
			</tr>			
			</table>					
		</div>	
		<div class="btnSearchSubmitBox">
			<div class="btnCircleSearch"><div class="btnCircleSearchTitle">검색</div><i class="xi-search xi-x"></i></div>
			<div class="btnCircleReset"><div class="btnCircleResetTitle">초기화</div><i class="xi-undo xi-x"></i></div>						
		</div>
	</div>
	</form>

	<script>
	<!--	
		$("form[name=searchForm] select[name='field']").val('{{field}}').heapbox({'width' : '200px'});
		$("form[name=searchForm] select[name='cate']").val('{{cate}}').heapbox({'width' : '99%'});
		$("form[name=searchForm] select[name='answer']").val('{{answer}}').heapbox({'width' : '99%'});
		$("form[name=searchForm] select[name='id']").val('{{id}}').heapbox({'width' : '99%'});
		
		$('.searchDetail').hide();
	//-->
	</script>

	<div class="empty60"></div>
	
	<div class="listTop">
		<form name='listSearchForm' method='get' action='{{PHP_SELF}}?{{searchstring}}' />
		<div class="listLeft size14">
			전체 : <b class="orange">{{ATOTAL}}</b>건 
			<!-- DYNAMIC @is_search@ -->
			, 검색 : <b class="orange">{{TOTAL}}</b>건
			<!-- DYNAMIC @is_search@ -->
		</div>
		<div class="listRight size10">
			<div class="floatLeft">
				<select name="sort">
					<option value="uid DESC">등록일 역순</option>
					<option value="uid ASC">등록일 순</option>					
				</select>
				&nbsp;&nbsp;
			</div>
			<div class="floatLeft">				
				<select name="limit">
					<option value="10">10개 보기</option>
					<option value="20">20개 보기</option>
					<option value="30">30개 보기</option>
					<option value="40">40개 보기</option>
					<option value="50">50개 보기</option>
					<option value="60">60개 보기</option>
					<option value="70">70개 보기</option>
					<option value="80">80개 보기</option>
					<option value="90">90개 보기</option>
					<option value="100">100개 보기</option>
				</select>
			</div>
		</div>
		</form>
	</div>

	<div class="empty10"></div>
	<div class="listLine"></div>
	<div class="listSelect"></div>

	<div id="listArea">
		<!-- DYNAMIC @is_list_area@ -->
		<form name="listForm" method="post" action='inquiry_post.php?{{addstring}}' target='HFrm'>
		<input type="hidden" name="mode" />
		<table class="listIn fixed-header">
		<colgroup>
		<col width="5%" /> 
		<col width="8%" /> 
		<col width="25%" /> 
		<col width="34%" />
		<col width="15%" />
		<col width="8%" />
		<col width="10%" />
		<col width="5%" />
		</colgroup>
		<thead> 
		<tr> 
			<th>번호</th>
			<th>문의종류</th>
			<th>상품명</th>
			<th>제목 <i class="xi-link"></i></th>			
			<th>등록인</th>
			<th>답변</th>			
			<th>등록일</th>	
			<th>보기</th>
		</tr>
		</thead>
		<tbody>
		<!-- DYNAMIC @loop_list@ -->		
		<tr>
			<td class="number">{{NUM}}</td>
			<td>{{CATE}}</td>
			<td style="text-align:left">{{G_NAME}}</td>
			<td style="text-align:left"><a href="inquiry_info.php?uid={{UID}}{{addstring}}" title="상품정보수정"  class="underLine">{{SUBJECT}}</a></td>
			<td>
				{{NAME}}
				<!-- DYNAMIC @is_member@ -->
				<center>
				<div class=''>
					<div class="empty5"></div>
					<div class='barId'>{{MEMBER_ID}}</div>
				</div>
				</center>
				<!-- DYNAMIC @is_member@ -->
			</td>
			<td>{{ANSWER}}</td>
			<td class="number">{{SIGNDATE}}</td>
			<td><i class="xi-eye-o masterTooltip" title="상세보기" onclick="window.location.href='inquiry_info.php?uid={{UID}}{{addstring}}'"></i></td>
		</tr>
		<!-- DYNAMIC @loop_list@ -->
		<!-- DYNAMIC @empty_list@ -->
		<tr>
			<td colspan="8" class="emptyList"><i class="fas fa-quote-left"></i>&nbsp;&nbsp;등록(검색)된 상품문의가 없습니다!&nbsp;&nbsp;<i class="fas fa-quote-right"></i></td>
		<tr>
		<!-- DYNAMIC @empty_list@ -->
		</tbody>
		</table>
		</form>
		<!-- DYNAMIC @is_list_area@ -->
	</div>

	<div class="listSelectB"></div>
	<div class="listSelectRB"></div>
	<div class="listLineB"></div>

	<div class="paging">{{PAGING}}</div>

</div>

<script src="../../lib/jquery.timeliny.js?ver={{ver}}"></script>
