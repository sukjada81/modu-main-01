<div id="contents">
	
	{{SUB_MENUS}}

	<h2 class="contentTitle">구매후기</h2>
	
	<div class="empty40"></div>

	<div>
		<div class="listTopTitle fontSCDream">
			전체 <b id="listTotal">{{TOTAL}}</b>
		</div>
	</div>	
	
	<div class="empty20"></div>

	<div class="review">

		<div id="listArea">
			<!-- DYNAMIC @is_list_area@ -->
			<div class="comment_list">
			<ul>
				<!-- DYNAMIC @loop_list@ -->
				<li class="comment_title width0 floatLeft">
					<!-- DYNAMIC @is_files@ -->
					<i class="xi-camera xi-x"></i>
					<!-- DYNAMIC @is_files@ -->
					<a href="{{Main}}?channel=view&uid={{G_UID}}">{{G_NAME}}</a>&nbsp;&nbsp;
					<!-- DYNAMIC @loop_stars@ -->
					<i class="xi-star"></i>
					<!-- DYNAMIC @loop_stars@ -->					
					<span class="date">{{SIGNDATE}}</span>					
				</li>
				<li class="comment_content">
					<!-- DYNAMIC @is_op_name@ -->
					<div class="options">선택옵션 <span>{{OP_NAME}}</span></div>
					<!-- DYNAMIC @is_op_name@ -->
					{{CONTENT}}
					<!-- DYNAMIC @is_attach@ -->
					<div class="image" data-uid="{{UID}}">
						<!-- DYNAMIC @loop_attach@ -->
						<img src="image/review/{{attach_name}}" alt="" />
						<!-- DYNAMIC @loop_attach@ -->
					</div>
					<!-- DYNAMIC @is_attach@ -->
					<div class="empty1"></div>
				</li>
				<!-- DYNAMIC @loop_list@ -->
			</ul>
			<!-- DYNAMIC @empty_list@ -->
			<div class="emptyList fontSCDream weight300">등록된 구매후기가 없습니다.</div>
			<!-- DYNAMIC @empty_list@ -->		
			<!-- DYNAMIC @is_list_area@ -->
		</div>

	</div>
	<div class="empty20"></div>

	<div class="paging">{{PAGING}}</div>
	
</div>
