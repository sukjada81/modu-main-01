<style>
.heapBoxBo { font-family: 'SCDream', sans-serif; font-size:14px; clear:both; display:inline-block; line-height:28px; position:relative; z-index:10; float:left; padding:16px 13px 3px 16px; min-height:41px; }
</style>

<link href="../lib/summernote-lite.css?ver={{ver}}" rel="stylesheet">
<script src="../lib/summernote-lite.js?ver={{ver}}"></script>
<script src="../lib/summernote-ko-KR.js"></script>

<div id="popup_contents">

	<form name='writeForm' method='post' action='inquiry_post.php' enctype="multipart/form-data" target='HFrm'>
	<input type="hidden" name="g_uid" value="{{uid}}" />
	
	<div class="content_write">
	
		<!-- DYNAMIC @is_cate@ -->
		<div class="cateBox">
			<select name="cate">
				<!-- DYNAMIC @loop_cate@ -->
				<option value="{{cate_num}}">{{cate_name}}</option>
				<!-- DYNAMIC @loop_cate@ -->
			</select>
			<script>
			<!--
				$("form[name=writeForm] select[name='cate']").val('{{cate}}').heapbox({'width' : '200px', 'top' : '63px'});
				if(!$("form[name=writeForm] select[name='cate']").val()) $("form[name=writeForm] select[name='cate']").val($("form[name=writeForm] select[name='cate'] option:first").val());
			//-->
			</script>
		</div>
		<!-- DYNAMIC @is_cate@ -->

		<!-- DYNAMIC @is_secret@ -->
		<div class="optionBox">
			<label><input type='checkbox' name="secret" value="1" checked='checked' /><span class="checkbox"></span>비밀글</label>			
		</div>
		<!-- DYNAMIC @is_secret@ -->

		<div class="empty1"></div>

	</div>

	<div class="loginBox loginBoxWide" style="padding-top:0px;">	
		<div class="inputBox registBox" style="padding-top:0; padding-bottom:0">
			<ul>	
				<li>
					<input type="text" name="g_name" value="{{g_name}}" required="required" readonly data-title="상품명" data-msg="상품명을" />
				</li>
				<!-- DYNAMIC @is_guest@ -->
				<li style="margin:0">
					<input type="text" name="" value="{{name}}" required="required" data-title="이름" data-msg="이름을" data-toname="name" />
				</li>
				<li style="margin:0">
					<input type='password' name='passwd' required="required" data-title="비밀번호" data-msg="비밀번호를" />
				</li>
				<!-- DYNAMIC @is_guest@ -->								
				<li style="margin:0">
					<input type="text" name="subject" value="{{subject}}" required="required" data-title="제목" data-msg="제목을" />
				</li>
				<li style="margin:0">
					<input type="text" name="contact" value="{{cell}}" required="required" data-title="연락처" data-msg="연락처를" />
				</li>	
				<!-- DYNAMIC @loop_attach@ -->
				<li style="margin:0; width:100%" class="attach{{i}} {{display}}" data-num="{{i}}">
					<div class="attachBox">						
						<div class="title">이미지 업로드</div>					
						<div class="file_name"></div> 
						<div class="delete"><i class="xi-close-thin xi-x" title="삭제"></i></div>
						<input type="file" name="attach_file{{i}}" class="uploadBtn" />
						<input type="hidden" name="attach_del{{i}}" value="" />
					</div>
				</li>
				<!-- DYNAMIC @loop_attach@ -->
				<li style="text-align:left;margin:10px 0;width:100%">
					<XMP class="sn_content" style="display:none">{{content}}</XMP>
					<input type="hidden" name="content" value= ""  required="required" data-notefor=".sn_content" />
				</li>
			</ul>	
		</div>
	</div>
		
	<!-- DYNAMIC @is_agreement@ -->
	<div class="content_write">
		<div class="infoBox">						
			<div class="title"><label><input type='checkbox' name="agreement" value="1" required="required" data-alert="1" data-msg-done="개인정보 수집 및 이용 동의는 필수 동의 사항입니다.<br />개인정보 수집 및 이용에 동의 하셔야 글등록이 가능합니다."  /><span class="checkbox"></span>개인정보 수집 및 이용 동의</label></div>
			<div class="info"><p>회사는 비회원의 게시글 등록 시 콘텐츠 등록 및 고객 문의 응대 등을 원활하게 진행하기 위해 아래와 같은 개인정보를 수집하고 있습니다.</p><p><br></p><p>- 수집항목: 이름, IP</p><p>- 수집/이용목적: 게시글 접수 및 결과 회신</p><p>- 이용기간: 개인정보 수집 및 이용목적 달성 시 까지</p></div>								
		</div>
		<div class="empty30"></div>
	</div>
	<!-- DYNAMIC @is_agreement@ -->	
	
	<div class="btnShineBox" style="background:#fff;">
		<div class="displayInline width100"><button class="fontSCDream weight300 shine black" type="submit">상품문의 등록</button></div>		
	</div>
		
	</form>

</div>	

</body>
</html>

<iframe name="HFrm" style="display:none;"></iframe>
