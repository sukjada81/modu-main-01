<div id="contents">	
	
	<h2 class="contentTitle">신상품</h2>

	<div class="empty40"></div>
	
	<div>
		<div class="listTopTitle fontSCDream">
			전체 <b id="listTotal">{{TOTAL}}</b>
		</div>				
		<div class="listTopSelect">
			<form name='listSearchForm' method='get' action='{{Main}}'>
			<input type="hidden" name="channel" value="{{channel}}" />
			<input type="hidden" name="cate" value="{{cate}}" />
			<input type="hidden" name="orig_keyword" value="{{orig_keyword}}" />

			<div class="floatLeft">
				<div class="icon_th3 cursorPoint" data-cnt="3"></div>
				<div class="icon_th4" data-cnt="4"></div>
				<div class="icon_th6 cursorPoint" data-cnt="6"></div>
			</div>
			<div class="floatLeft" style="padding:0 10px;">
				<select name="sort">
					<option value="re_uid ASC">최신순</option>
					<option value="price ASC">가격낮은순</option>
					<option value="price DESC">가격높은순</option>
				</select>
			</div>
			<div class="floatLeft">
				<select name="limit">
					<option value="12">12개 보기</option>
					<option value="24">24개 보기</option>
					<option value="48">48개 보기</option>
					<option value="96">96개 보기</option>
				</select>
			</div>
			<div class="floatLeft positionRelative" style="padding-left:10px;">
				<input type="text" name="keyword" class="search" placeholder="결과 내 검색" required="required" autocomplete="off" data-msg="검색어를" data-on-enter="1" data-search-btn=1 />
			</div>
			<div class="keywordList"></div>
			<div class="arrow rotate45"></div>
			</form>
		</div>
	</div>	
	
	<div class="empty20"></div>

	<div id="listArea">
		<!-- DYNAMIC @is_list_area@ -->
		<!-- DYNAMIC @loop_list@ -->
		<div class="goodsItemBox">
			<div class="goodsItem goodsItem4">
				<ul>				
					<li>
						<a href="{{Main}}?channel=view&cate={{cate}}&uid={{UID}}"><img src="image/goods/img{{IMAGE2}}" alt="{{NAME}}" height="285" /></a>
						<!-- DYNAMIC @is_list_soldout@ -->	
						<span class="soldoutIcon">품절</span>
						<!-- DYNAMIC @is_list_soldout@ -->
					</li>
					<li><a href="{{Main}}?channel=view&cate={{cate}}&uid={{UID}}">{{NAME_CODE_ABLE}}</a></li>
					<li>
						<div>￦{{PRICE}}</div>
						<!-- DYNAMIC @is_list_coupon@ -->	
						<div class="couponIcon">쿠폰</div>						
						<!-- DYNAMIC @is_list_coupon@ -->
						<!-- DYNAMIC @is_list_sale@ -->	
						<div class="salePrice">{{SALE}}%&nbsp;<i class="xi-arrow-down"></i></div>
						<!-- DYNAMIC @is_list_sale@ -->
						<!-- DYNAMIC @is_list_orig_price@ -->
						<div class="origPrice"><s>{{ORIG_PRICE}}</s></div>
						<!-- DYNAMIC @is_list_orig_price@ -->
					</li>		
					<li>{{ICON}}</li>
				</ul>
			</div>
		</div>
		<!-- DYNAMIC @loop_list@ -->
		<!-- DYNAMIC @empty_list@ -->
		<div class="emptyList fontSCDream weight300">등록된 상품이 없거나 선택한 조건에 맞는 상품이 없습니다.</div>
		<!-- DYNAMIC @empty_list@ -->
		<!-- DYNAMIC @is_list_area@ -->
	</div>			
	<div class="paging">{{PAGING}}</div>
	<!-- DYNAMIC @empty_list2@ -->
	<div class="empty30"></div>
	<script>
		$(".paging").hide();
	</script>
	<!-- DYNAMIC @empty_list2@ -->	

</div>	

<script src="lib/jquery.timeliny.js?ver={{ver}}"></script>

	var defaultSort		= "{{sort}}";

// -->

	pageClickReset();
	<!-- DYNAMIC @is_paging_type_0@ -->

	<!-- DYNAMIC @is_paging_type_1@ -->

	if(limit != defaultLimit || secKeyword) changeSL(1, page);
	<!-- DYNAMIC @is_paging_type_1@ -->
	
	<!-- DYNAMIC @loop_keyword_list@ -->
