<link type="text/css" rel="stylesheet" href="lib/datepicker.css" />
<script src="lib/datepicker.js"></script>

<div id="contents">	
	
	{{SUB_MENUS}}
	
	<h2 class="contentTitle">마일리지</h2>
	
	<div class="empty40"></div>

	<div class="content_list">
		<div id="contentMenuA" class="contentMenu">
			<ul>
				<li class="contentMenuSub"><b>보유 마일리지 : <span class="fontMontserrat weight600">{{mileage1}}P</span></b></li>
				<li class="contentMenuSub">적립 마일리지 : <span class="fontMontserrat">{{mileage2}}P</span></li>
				<li class="contentMenuSub">사용 마일리지 : <span class="fontMontserrat">{{mileage3}}P</span></li>				
			</ul>
			<div class="contentBar left"></div>
			<div class="contentBar right"></div>

			<script>
				var a = 100 / parseInt($("#contentMenuA ul li").length);
				$("#contentMenuA .contentMenuSub").css({'width':'calc('+a+'% - 2px)'});
			
				$('#contentMenuA .contentMenuSub').hover(function(e){		
					if(!$(this).hasClass('selected')) {
						var left = $(this).position().left;
						var right = parseInt(left + parseInt($(this).css('width'))) + 2; 

						$("#contentMenuA .left").css({left:left}).show();
						$("#contentMenuA .right").css({left:right}).show();
					}
				}, 
				function() {
					$("#contentMenuA .left").hide();
					$("#contentMenuA .right").hide();
				});				
			</script>
		</div>
		<div class="empty40"></div>
		<div id="contentMenu" class="contentMenu">
			<ul>
				<li class="contentMenuSub {{type1}}" data-type="1">적립내역</li>
				<li class="contentMenuSub {{type2}}" data-type="2">사용내역</li>	
				<li class="contentMenuSub {{type3}}" data-type="3">소멸예정내역</li>	
			</ul>
			<div class="contentBar left"></div>
			<div class="contentBar right"></div>

			<script>
				var a = 100 / parseInt($("#contentMenu ul li").length);
				$("#contentMenu .contentMenuSub").css({'width':'calc('+a+'% - 2px)'});
			
				$('#contentMenu .contentMenuSub').hover(function(e){		
					if(!$(this).hasClass('selected')) {
						var left = $(this).position().left;
						var right = parseInt(left + parseInt($(this).css('width'))) + 2; 

						$("#contentMenu .left").css({left:left}).show();
						$("#contentMenu .right").css({left:right}).show();
					}
				}, 
				function() {
					$("#contentMenu .left").hide();
					$("#contentMenu .right").hide();
				});

				$('#contentMenu .contentMenuSub').click(function(e){
					var type = $(this).attr('data-type');
					window.location.href = "{{Main}}?channel=my_mileage&type=" + type;
				});
				
			</script>
		</div>
	</div>
	
	<div class="content_list">

		<div>
			<div class="listTopTitle fontSCDream">
				전체 <b id="listTotal">{{TOTAL}}</b>
			</div>
			<div class="listTopSelect">
				<form name='searchForm' method='get' action='{{Main}}'>
				<input type="hidden" name="channel" value="{{channel}}" />
				
				<div class="floatLeft" style="padding:0 10px 0 0;">
					<div class="floatLeft" style="padding-right:15px;">
						<button class="shineButtonSmall btns2" style="height:32px;" type="button" data-s_date='{{DATE1}}' data-e_date='{{DATE1}}'>오늘</button>
						<button class="shineButtonSmall btns2" style="height:32px;" type="button" data-s_date='{{DATE4}}' data-e_date='{{DATE1}}'>1개월</button>
						<button class="shineButtonSmall btns2" style="height:32px;" type="button" data-s_date='{{DATE5}}' data-e_date='{{DATE1}}'>3개월</button>
						<button class="shineButtonSmall btns2" style="height:32px;" type="button" data-s_date='{{DATE6}}' data-e_date='{{DATE1}}'>6개월</button>
						<button class="shineButtonSmall btns2" style="height:32px;" type="button" data-s_date='' data-e_date=''>전체</button>					
					</div>
					<div class="floatLeft positionRelative"><input type="text" name="s_date" class="dates" value="{{s_date}}" /></div>
					<div class="floatLeft" style="padding:4px 10px 0 10px;">~</div>
					<div class="floatLeft positionRelative"><input type="text" name="e_date" class="dates" value="{{e_date}}" /></div>
				</div>
				<div class="floatLeft" style="padding:0 20px 0 0px;">
					<button class="shineButtonSmall btnSearch2" style="height:32px;" type="button">조회</button>	
				</div>				
				<div class="floatLeft">
					<select name="limit">
						<option value="10">10개 보기</option>
						<option value="20">20개 보기</option>
						<option value="40">40개 보기</option>
						<option value="100">100개 보기</option>
					</select>
				</div>
				</form>
			</div>
		</div>	
		
		<div class="empty20"></div>

		<div id="listArea">
			<!-- DYNAMIC @is_list_area@ -->
			<table class="listIn fixed-header">
			<colgroup>
			<col width="8%" /> 
			<col width="52%" />
			<col width="10%" />
			<col width="15%" />
			<col width="15%" />
			</colgroup>
			<thead> 
			<tr> 
				<th>번호</th>			
				<th>내역</th>
				<th>적립 마일리지</th>
				<th>유효기간</th>
				<th>적립일</th>
			</tr>
			</thead>
			<tbody>
			<!-- DYNAMIC @loop_list@ -->			
			<tr>
				<td class="num">{{NUM}}</td>
				<td class="tleft">{{CONTENT}}</td>			
				<td class="num">{{MILEAGE}}</td>
				<td class="num">{{EXPIRED_DATE}}</td>
				<td class="num">{{SIGNDATE}}</td>
			</tr>
			<!-- DYNAMIC @loop_list@ -->
			<!-- DYNAMIC @empty_list@ -->
			<tr>
				<td colspan="5" class="emptyList">적립된 마일리지 내역이 없습니다.</td>
			<tr>
			<!-- DYNAMIC @empty_list@ -->
			</tbody>
			</table>
			</form>
			<!-- DYNAMIC @is_list_area@ -->
		</div>

		<div class="empty40"></div>

		<div class="paging">{{PAGING}}</div>
	</div>	
</div>
