<div id="contents" class="wide">	

	<h2 class="contentTitle">모음전</h2>

	<div class="exhibition_title">{{TITLE}}</div>

	<div class="empty20"></div>
	
	<div class="exhibition_content">{{EXPLAINS}}</div>
	
	<!-- DYNAMIC @is_cate@ -->
	
	<!-- DYNAMIC @loop_cate@ -->
	<div class="empty40"></div>
	
	<div class="cateList">		
		<ul id="contentMenu_{{k}}">
			<!-- DYNAMIC @loop_cate2@ -->
			<li class="contentMenuSub {{cate_selected}}" data-cate="{{cate_num}}">{{cate_name}}</li>
			<!-- DYNAMIC @loop_cate2@ -->
		</ul>
	</div>

	<script>
		
		$('#contentMenu_{{k}} .contentMenuSub').click(function(e){
			var cate =$(this).attr('data-cate');
			var top = $("#contentMenu_" + cate).offset().top;
			$("html, body").animate({ scrollTop: top - 80 }, 100);
		});
		
	</script>

	<div class="empty20"></div>

	<div>
		<!-- DYNAMIC @loop_goods@ -->
		<div class="goodsItemBox goodsItemBox2">
			<div class="goodsItem">
				<ul>				
					<li>
						<a href="{{LINK}}"><img src="{{IMAGE}}" alt="{{NAME}}" height="285" /></a>
						<!-- DYNAMIC @is_soldout@ -->	
						<span class="soldoutIcon">품절</span>
						<!-- DYNAMIC @is_soldout@ -->	
					</li>
					<li><a href="{{LINK}}">{{NAME_CODE_ABLE}}</a></li>
					<li>
						<div>￦{{PRICE}}</div>
						<!-- DYNAMIC @is_coupon@ -->	
						<div class="couponIcon">쿠폰</div>						
						<!-- DYNAMIC @is_coupon@ -->
						<!-- DYNAMIC @is_sale@ -->	
						<div class="salePrice">{{SALE}}%&nbsp;<i class="xi-arrow-down"></i></div>
						<!-- DYNAMIC @is_sale@ -->
						<!-- DYNAMIC @is_orig_price@ -->
						<div class="empty1"></div>
						<div class="origPrice"><s>{{ORIG_PRICE}}</s></div>
						<!-- DYNAMIC @is_orig_price@ -->
					</li>
					<li>{{ICON}}</li>
				</ul>
			</div>
		</div>
		<!-- DYNAMIC @loop_goods@ -->
	</div>
	<!-- DYNAMIC @loop_cate@ -->

</div>
	<!-- DYNAMIC @is_cate@ -->


	<!-- DYNAMIC @is_no_cate@ -->	
	<div class="cate_main">
		<div class="listTopTitle fontSCDream">
			전체 <b id="listTotal">{{TOTAL}}</b>
		</div>	
		
		<div class="line"></div>
		<div class="empty15"></div>
		
		<div class="listTopSelect">
			<form name='listSearchForm' method='get' action='{{Main}}'>
			<input type="hidden" name="channel" value="{{channel}}" />
			<input type="hidden" name="uid" value="{{uid}}" />
			
			<div class="floatLeft" style="padding:0 10px; width:calc(100% - 20px)">
				<select name="sort">
					<option value="best">인기순</option>
					<option value="re_uid ASC">최신순</option>
					<option value="price ASC">가격낮은순</option>
					<option value="price DESC">가격높은순</option>
				</select>
			</div>
			</form>		
		</div>

		<div class="empty15"></div>
		<div class="line"></div>

	</div>	
	
	<div class="empty20"></div>

	<div id="listArea">
		<!-- DYNAMIC @is_list_area@ -->
		<!-- DYNAMIC @loop_list@ -->
		<div class="goodsItemBox goodsItemBox2">
			<div class="goodsItem">
				<ul>				
					<li>
						<a href="{{Main}}?channel=view&cate={{cate}}&uid={{UID}}"><img src="image/goods/img{{IMAGE2}}" alt="{{NAME}}" height="285" /></a>
						<!-- DYNAMIC @is_list_soldout@ -->	
						<span class="soldoutIcon">품절</span>
						<!-- DYNAMIC @is_list_soldout@ -->
					</li>
					<li><a href="{{Main}}?channel=view&cate={{cate}}&uid={{UID}}">{{NAME_CODE_ABLE}}</a></li>
					<li>
						<div>￦{{PRICE}}</div>
						<!-- DYNAMIC @is_list_coupon@ -->	
						<div class="couponIcon">쿠폰</div>						
						<!-- DYNAMIC @is_list_coupon@ -->
						<!-- DYNAMIC @is_list_sale@ -->	
						<div class="salePrice">{{SALE}}%&nbsp;<i class="xi-arrow-down"></i></div>
						<!-- DYNAMIC @is_list_sale@ -->
						<!-- DYNAMIC @is_list_orig_price@ -->
						<div class="empty1"></div>
						<div class="origPrice"><s>{{ORIG_PRICE}}</s></div>
						<!-- DYNAMIC @is_list_orig_price@ -->
					</li>		
					<li>{{ICON}}</li>
				</ul>
			</div>
		</div>
		<!-- DYNAMIC @loop_list@ -->
		<!-- DYNAMIC @empty_list@ -->
		<div class="emptyList fontSCDream weight300">등록된 상품이 없습니다.</div>
		<!-- DYNAMIC @empty_list@ -->
		<!-- DYNAMIC @is_list_area@ -->
	</div>			
	<div class="paging">{{PAGING}}</div>
	
</div>	

<script src="lib/jquery.timeliny.js?ver={{ver}}"></script>

	pageClickReset();
