<div class="content_list">

	<!-- DYNAMIC @is_cate@ -->
	<div id="contentMenu" class="contentMenu">
		<ul>
			<li class="contentMenuSub {{cate_selected_all}}" data-link="">전체</li>
			<!-- DYNAMIC @loop_cate@ -->
			<li class="contentMenuSub {{cate_selected}}" data-link="{{cate_num}}">{{cate_name}}</li>
			<!-- DYNAMIC @loop_cate@ -->
		</ul>
		<div class="contentBar left"></div>
		<div class="contentBar right"></div>

		<script>
			var a = 100 / parseInt($("#contentMenu ul li").length);
			$("#contentMenu .contentMenuSub").css({'width':'calc('+a+'% - 2px)'});
		
			$('#contentMenu .contentMenuSub').hover(function(e){		
				if(!$(this).hasClass('selected')) {
					var left = $(this).position().left;
					var right = parseInt(left + parseInt($(this).css('width'))) + 2; 

					$("#contentMenu .left").css({left:left}).show();
					$("#contentMenu .right").css({left:right}).show();
				}
			}, 
			function() {
				$("#contentMenu .left").hide();
				$("#contentMenu .right").hide();
			});

			$('#contentMenu .contentMenuSub').click(function(e){
				var link =$(this).attr('data-link');
				if(link)	window.location.href = "{{DEFAULT_LINK}}&cate=" + link;
				else		window.location.href = "{{DEFAULT_LINK}}";
			});
			
		</script>
	</div>
	<!-- DYNAMIC @is_cate@ -->
	
	<div>				
		<div class="listTopTitle fontSCDream">
			전체 <b id="listTotal">{{TOTAL}}</b>
		</div>	

		<div class="listTopSelect">

			<form name='searchForm' method='get' action='{{Main}}' />
			<input type="hidden" name="channel" value="{{channel}}" />
			<input type="hidden" name="b_id" value="{{b_id}}" />
			
			<div class="floatLeft alignLeft">
				<select name="field">
					<option value="S">제목</option>
					<option value="C">내용</option>
					<option value="SC">제목 + 내용</option>
				</select>
				<script>
				<!--
					$("form[name=searchForm] select[name='field']").val('{{field}}').heapbox({'width' : '130px'});
				//-->
				</script>
			</div>
			<div class="floatLeft positionRelative" style="padding-left:10px;">
				<input type="text" name="keyword" class="search" value="{{keyword}}" required="required" autocomplete="off" placeholder="검색어입력" data-msg="검색어를" data-on-enter="1" data-search-btn=1 />
				<p class="resetIcon resetIconBtn"><i class="xi-undo masterTooltip" title="초기화"></i></p>
			</div>		
			</form>
		</div>	
	</div>
	
	<div class="empty10"></div>

	<div id="listArea">
		<!-- DYNAMIC @is_list_area@ -->
		<table class="listIn fixed-header">
		<colgroup>
		<col width="8%" /> 
		<col width="66%" />
		<col width="8%" />
		<col width="8%" />
		<col width="10%" />
		</colgroup>
		<thead> 
		<tr> 
			<th>번호</th>			
			<th>제목</th>
			<th>작성자</th>
			<th>조회수</th>
			<th>등록일</th>
		</tr>
		</thead>
		<tbody>
		<!-- DYNAMIC @loop_list@ -->		
		<tr>
			<td class="num">{{NUM}}</td>
			<td class="tleft">
				<!-- DYNAMIC @is_notice@ -->
				<i class="xi-lightbulb-o xi-x" title="공지"></i>
				<!-- DYNAMIC @is_notice@ -->
				<!-- DYNAMIC @is_secret@ -->
				<i class="xi-lock-o xi-x" title="비밀글"></i>
				<!-- DYNAMIC @is_secret@ -->
				<!-- DYNAMIC @is_depth@ -->
				{{EMPTY}}<i class="xi-subdirectory-arrow xi-x"></i>
				<!-- DYNAMIC @is_depth@ -->
				<span class="underLineThin listSubject" data-uid="{{UID}}" data-secret="{{SECRET}}">{{SUBJECT}}</span>
				<!-- DYNAMIC @is_delete_article@ -->
				삭제된 글입니다.
				<!-- DYNAMIC @is_delete_article@ -->
				<!-- DYNAMIC @is_new_icon@ -->
				<i class="xi-new xi-x"></i>
				<!-- DYNAMIC @is_new_icon@ -->
				<!-- DYNAMIC @is_comment@ -->
				<i class="xi-message xi-x"></i> <span class="num">{{COMMENT_COUNT}}</span>
				<!-- DYNAMIC @is_comment@ -->				
			</td>
			<td>{{NAME}}</td>
			<td class="num">{{COUNT}}</td>
			<td class="num">{{SIGNDATE}}</td>			
		</tr>
		<!-- DYNAMIC @loop_list@ -->
		<!-- DYNAMIC @empty_list@ -->
		<tr>
			<td colspan="5" class="emptyList">등록(검색)된 글이 없습니다.</td>
		<tr>
		<!-- DYNAMIC @empty_list@ -->
		</tbody>
		</table>
		</form>
		<!-- DYNAMIC @is_list_area@ -->
	</div>
	
	<!-- DYNAMIC @is_write@ -->
	<div class="listBtn">
		<button class="graButton btnLWrite" style="width:100px" type="button"><span class="text"><i class="xi-document xi-x"></i> 글쓰기</button>		
	</div>
	<!-- DYNAMIC @is_write@ -->

	<div class="paging">{{PAGING}}</div>

</div>
