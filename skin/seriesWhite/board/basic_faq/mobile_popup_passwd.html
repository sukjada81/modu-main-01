<div id="popup_contents">

	<form name='passwdForm' method='post' action='' target='{{target}}' data-submit-proc='submitProc'>
	<!-- DYNAMIC @is_post@ -->
	<input type="hidden" name="mypages" value="{{mypages}}" />
	<input type="hidden" name="b_id" value="{{b_id}}" />
	<input type="hidden" name="b_mode" value="{{type}}" />
	<input type="hidden" name="uid" value="{{uid}}" />
	<input type="hidden" name="c_uid" value="{{c_uid}}" />
	<!-- DYNAMIC @is_post@ -->
	<div class="loginBox loginBoxWide">	
		<div class="inputBox">
			<ul>	
				<li class="alignLeft fontSCDream">
					<input type='text' name='subject' value="{{SUBJECT}}" readonly data-title="{{TTL}}" />
				</li>
				<!-- DYNAMIC @is_guest@ -->
				<li>
					<input type='password' name='passwd' required="required" data-title="비밀번호" data-msg="비밀번호를" data-detail="글등록시 입력한 비밀번호" data-icon-no=1 data-on-enter=1 />
				</li>
				<!-- DYNAMIC @is_guest@ -->
			</ul>		
		</div>		

		<div class="btnShineBox" style="background:#fff;">
			<div class="displayInline width100"><button class="fontSCDream weight300 shine black" type="submit">확인</button></div>		
		</div>
	</div>	
	</form>
</div>

</body>
</html>

<iframe name="HFrm" style="display:none;"></iframe>
