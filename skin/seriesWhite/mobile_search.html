<div id="contents" class="wide">	
	
	<h2 class="contentTitle">'{{print_keyword}}' 검색결과</h2>

	<div class="empty30"></div>

	<div class="cateList">		
		<ul>
			<!-- DYNAMIC @loop_cate@ -->
			<li data-cate='{{CATE}}' class="{{selected}}">
				{{CATE_NAME}}
				<!-- DYNAMIC @is_sub_cate@ -->
				<span><i class="xi-angle-down-thin"></i></span>
				<div class="cateSubMenu cateSubMenu{{CATE}}">
					<a href="{{Main}}?channel=list&cate={{CATE}}"><div>전체</div></a>
					<!-- DYNAMIC @loop_sub_cate@ -->
					<a href="{{Main}}?channel=list&cate={{SUB_CATE}}" class="{{selected_sub}}"><div>{{SUB_CATE_NAME}}</div></a>
					<!-- DYNAMIC @loop_sub_cate@ -->
				</div>
				<!-- DYNAMIC @is_sub_cate@ -->
			</li>
			<!-- DYNAMIC @loop_cate@ -->
		</ul>
	</div>

	
	<div class="cate_main">
		<div class="listTopTitle fontSCDream">
			전체 <b id="listTotal">{{TOTAL}}</b>
		</div>	
		
		<div class="line"></div>
		<div class="empty15"></div>

		<div class="listTopSelect">
			<form name='listSearchForm' method='get' action='{{Main}}'>
			<input type="hidden" name="channel" value="{{channel}}" />
			<input type="hidden" name="cate" value="{{cate}}" />
			<input type="hidden" name="orig_keyword" value="" />
			<input type="hidden" name="def_keyword" value="{{def_keyword}}" />

			<div class="floatLeft" style="padding:0 10px; width:calc(50% - 20px)">
				<select name="sort">
					<option value="best">인기순</option>
					<option value="re_uid ASC">최신순</option>
					<option value="price ASC">가격낮은순</option>
					<option value="price DESC">가격높은순</option>
				</select>
			</div>
			<div class="floatLeft" style="padding:0 10px; width:calc(50% - 20px)">
				<select name="limit">
					<option value="12">12개 보기</option>
					<option value="24">24개 보기</option>
					<option value="48">48개 보기</option>
					<option value="96">96개 보기</option>
				</select>
			</div>

			<div class="empty15"></div>

			<div class="positionRelative" style="padding-left:10px; position:relative; ">
				<input type="text" name="keyword" class="search" placeholder="결과 내 검색" required="required" autocomplete="off" data-msg="검색어를" data-on-enter="1" data-search-btn=1 />
			</div>
			<div class="keywordList"></div>			
			</form>
		</div>

		<div class="empty15"></div>
		<div class="line"></div>
	</div>	
		
	<div class="empty20"></div>

	<div id="listArea">
		<!-- DYNAMIC @is_list_area@ -->
		<!-- DYNAMIC @loop_list@ -->
		<div class="goodsItemBox goodsItemBox2">
			<div class="goodsItem">
				<ul>				
					<li>
						<a href="{{Main}}?channel=view&uid={{UID}}&cate={{cate}}"><img src="image/goods/img{{IMAGE2}}" alt="{{NAME}}" height="285" /></a>
						<!-- DYNAMIC @is_list_soldout@ -->	
						<span class="soldoutIcon">품절</span>
						<!-- DYNAMIC @is_list_soldout@ -->	
					</li>
					<li><a href="{{Main}}?channel=view&uid={{UID}}&cate={{cate}}">{{NAME_CODE_ABLE}}</a></li>
					<li>
						<div>￦{{PRICE}}</div>
						<!-- DYNAMIC @is_list_coupon@ -->	
						<div class="couponIcon">쿠폰</div>						
						<!-- DYNAMIC @is_list_coupon@ -->
						<!-- DYNAMIC @is_list_sale@ -->	
						<div class="salePrice">{{SALE}}%&nbsp;<i class="xi-arrow-down"></i></div>
						<!-- DYNAMIC @is_list_sale@ -->
						<!-- DYNAMIC @is_list_orig_price@ -->
						<div class="empty1"></div>
						<div class="origPrice"><s>{{ORIG_PRICE}}</s></div>
						<!-- DYNAMIC @is_list_orig_price@ -->
					</li>		
					<li>{{ICON}}</li>
				</ul>
			</div>
		</div>
		<!-- DYNAMIC @loop_list@ -->
		<!-- DYNAMIC @empty_list@ -->
		<div class="emptyList">등록된 상품이 없거나 선택한 조건에 맞는 상품이 없습니다.</div>
		<!-- DYNAMIC @empty_list@ -->
		<!-- DYNAMIC @is_list_area@ -->
	</div>			
	<div class="paging">{{PAGING}}</div>
	
</div>	

<script src="lib/jquery.timeliny.js?ver={{ver}}"></script>
