<div id="contents">	
	<h2 class="contentTitle">{{TITLE}}</h2>

	<div class="fontSCDream addPage">{{EXPLAINS}}</div>

	<!-- DYNAMIC @is_cate@ -->
	
	<!-- DYNAMIC @loop_cate@ -->
	<div class="empty40"></div>
	
	<div class="content_list">
		<div id="contentMenu_{{k}}" class="contentMenu">
			<ul>
				<!-- DYNAMIC @loop_cate2@ -->
				<li class="contentMenuSub {{cate_selected}}" data-cate="{{cate_num}}">{{cate_name}}</li>
				<!-- DYNAMIC @loop_cate2@ -->
			</ul>
			<div class="contentBar left"></div>
			<div class="contentBar right"></div>

			<script>
				var a = 100 / parseInt($("#contentMenu_{{k}} ul li").length);
				$("#contentMenu_{{k}} .contentMenuSub").css({'width':'calc('+a+'% - 2px)'});
			
				$('#contentMenu_{{k}} .contentMenuSub').hover(function(e){		
					if(!$(this).hasClass('selected')) {
						var left = $(this).position().left;
						var right = parseInt(left + parseInt($(this).css('width'))) + 2; 

						$("#contentMenu_{{k}} .left").css({left:left}).show();
						$("#contentMenu_{{k}} .right").css({left:right}).show();
					}
				}, 
				function() {
					$("#contentMenu_{{k}} .left").hide();
					$("#contentMenu_{{k}} .right").hide();
				});

				$('#contentMenu_{{k}} .contentMenuSub').click(function(e){
					var cate =$(this).attr('data-cate');
					var top = $("#contentMenu_" + cate).offset().top;
					$("html, body").animate({ scrollTop: top - 80 }, 100);
				});
				
			</script>
		</div>
	</div>

	<div>
		<!-- DYNAMIC @loop_goods@ -->
		<div class="goodsItemBox">
			<div class="goodsItem goodsItem4">
				<ul>				
					<li>
						<a href="{{LINK}}"><img src="{{IMAGE}}" alt="{{NAME}}" height="285" /></a>
						<!-- DYNAMIC @is_soldout@ -->	
						<span class="soldoutIcon">품절</span>
						<!-- DYNAMIC @is_soldout@ -->	
					</li>
					<li><a href="{{LINK}}">{{NAME_CODE_ABLE}}</a></li>
					<li>
						<div>￦{{PRICE}}</div>
						<!-- DYNAMIC @is_coupon@ -->	
						<div class="couponIcon">쿠폰</div>						
						<!-- DYNAMIC @is_coupon@ -->
						<!-- DYNAMIC @is_sale@ -->	
						<div class="salePrice">{{SALE}}%&nbsp;<i class="xi-arrow-down"></i></div>
						<!-- DYNAMIC @is_sale@ -->
						<!-- DYNAMIC @is_orig_price@ -->
						<div class="origPrice"><s>{{ORIG_PRICE}}</s></div>
						<!-- DYNAMIC @is_orig_price@ -->
					</li>
					<li>{{ICON}}</li>
				</ul>
			</div>
		</div>
		<!-- DYNAMIC @loop_goods@ -->
	</div>
	<!-- DYNAMIC @loop_cate@ -->

</div>
	<!-- DYNAMIC @is_cate@ -->


	<!-- DYNAMIC @is_no_cate@ -->
	<div class="empty40"></div>
	
	<div>
		<div class="listTopTitle fontSCDream">
			전체 <b id="listTotal">{{TOTAL}}</b>
		</div>				
		<div class="listTopSelect">
			<form name='listSearchForm' method='get' action='{{Main}}'>
			<input type="hidden" name="channel" value="{{channel}}" />
			<input type="hidden" name="uid" value="{{uid}}" />
			<div class="floatLeft">
				<div class="icon_th3 cursorPoint" data-cnt="3"></div>
				<div class="icon_th4" data-cnt="4"></div>
				<div class="icon_th6 cursorPoint" data-cnt="6"></div>
			</div>
			<div class="floatLeft" style="padding-left:20px;">
				<select name="limit">
					<option value="12">12개 보기</option>
					<option value="24">24개 보기</option>
					<option value="48">48개 보기</option>
					<option value="96">96개 보기</option>
				</select>
			</div>
			</form>
		</div>
	</div>	
	
	<div class="empty20"></div>

	<div id="listArea">
		<!-- DYNAMIC @is_list_area@ -->
		<!-- DYNAMIC @loop_list@ -->
		<div class="goodsItemBox">
			<div class="goodsItem goodsItem4">
				<ul>				
					<li>
						<a href="{{Main}}?channel=view&cate={{cate}}&uid={{UID}}"><img src="image/goods/img{{IMAGE2}}" alt="{{NAME}}" height="285" /></a>
						<!-- DYNAMIC @is_list_soldout@ -->	
						<span class="soldoutIcon">품절</span>
						<!-- DYNAMIC @is_list_soldout@ -->
					</li>
					<li><a href="{{Main}}?channel=view&cate={{cate}}&uid={{UID}}">{{NAME_CODE_ABLE}}</a></li>
					<li>
						<div>￦{{PRICE}}</div>
						<!-- DYNAMIC @is_list_coupon@ -->	
						<div class="couponIcon">쿠폰</div>						
						<!-- DYNAMIC @is_list_coupon@ -->
						<!-- DYNAMIC @is_list_sale@ -->	
						<div class="salePrice">{{SALE}}%&nbsp;<i class="xi-arrow-down"></i></div>
						<!-- DYNAMIC @is_list_sale@ -->
						<!-- DYNAMIC @is_list_orig_price@ -->
						<div class="origPrice"><s>{{ORIG_PRICE}}</s></div>
						<!-- DYNAMIC @is_list_orig_price@ -->
					</li>		
					<li>{{ICON}}</li>
				</ul>
			</div>
		</div>
		<!-- DYNAMIC @loop_list@ -->
		<!-- DYNAMIC @empty_list@ -->
		<div class="emptyList fontSCDream weight300">등록된 상품이 없습니다.</div>
		<!-- DYNAMIC @empty_list@ -->
		<!-- DYNAMIC @is_list_area@ -->
	</div>			
	<div class="paging">{{PAGING}}</div>
	
</div>
