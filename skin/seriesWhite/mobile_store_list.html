<div id="contents" class="wide">

	<h2 class="contentTitle">스토어</h2>
	
	<div class="empty40"></div>
	
	<div>
		<div class="listTopTitle fontSCDream" style="padding-left:10px;">
			전체 <b id="listTotal">{{TOTAL}}</b>
		</div>
	</div>	
	
	<div class="empty20"></div>

	<div class="content_list">
		<div id="listArea">
			<!-- DYNAMIC @is_list_area@ -->
			<!-- DYNAMIC @loop_list@ -->		
			<div class="empty20"></div>
			<div class="sub_title">
				<a href="{{Main}}?channel=store&vendor={{VENDOR}}"><i class="xi-shop xi-x"></i> {{STORE_NAME}}</a>
				<span>				
					<i class="xi-heart-o xi-x btnFavStore btnFavStore2_{{ID}} cursorPoint <!-- DYNAMIC @is_selected@ -->colorOrange<!-- DYNAMIC @is_selected@ -->" title="관심스토어등록" data-id="{{ID}}"></i> <b class="favStoreCnt_{{ID}}">{{FSTORE_CNT}}</b>
				</span>
			</div>
			<div class="empty20"></div>
			<div style="width:100%; overflow:auto;">
				<div style="width:1550px">
					<!-- DYNAMIC @loop_vendor_goods@ -->
					<div class="goodsItemBox" style="width:250px; display:inline-block; padding-bottom:30px;">
						<div class="goodsItem">
							<ul>				
								<li>
									<a href="{{LINK}}"><img src="{{IMAGE}}" alt="{{NAME}}" height="285" /></a>
									<!-- DYNAMIC @is_soldout2@ -->	
									<span class="soldoutIcon">품절</span>
									<!-- DYNAMIC @is_soldout2@ -->	
								</li>
								<li><a href="{{LINK}}">{{NAME_CODE_ABLE}}</a></li>
								<li>
									<div>￦{{PRICE}}</div>
									<!-- DYNAMIC @is_coupon2@ -->	
									<div class="couponIcon">쿠폰</div>						
									<!-- DYNAMIC @is_coupon2@ -->
									<!-- DYNAMIC @is_sale2@ -->	
									<div class="salePrice">{{SALE}}%&nbsp;<i class="xi-arrow-down"></i></div>
									<!-- DYNAMIC @is_sale2@ -->
									<!-- DYNAMIC @is_orig_price2@ -->
									<div class="origPrice"><s>{{ORIG_PRICE}}</s></div>
									<!-- DYNAMIC @is_orig_price2@ -->
								</li>
								<li>{{ICON}}</li>
							</ul>
						</div>
					</div>
					<!-- DYNAMIC @loop_vendor_goods@ -->
					<!-- DYNAMIC @empty_vendor_goods@ -->
					<div class="emptyList"> 등록된 상품이 없습니다.</div>
					<!-- DYNAMIC @empty_vendor_goods@ -->
				</div>
			</div>
			<!-- DYNAMIC @loop_list@ -->	

			<!-- DYNAMIC @empty_list@ -->
			<div class="emptyList"> 등록된 스토어가 없습니다.</div>
			<!-- DYNAMIC @empty_list@ -->

			<!-- DYNAMIC @is_list_area@ -->
		</div>
	</div>

	<div class="paging">{{PAGING}}</div>
	
</div>

	var isLogin				= 1;
	<!-- DYNAMIC @is_login@ -->
	isLogin					= 0;
	<!-- DYNAMIC @is_login@ -->

	function addFavoriteStore2(vendor) {
		if(!vendor) return;
		
		var data = new FormData();
		data.append('vendor', vendor);

		$.ajax({
			url: 'php/favorite_store_json.php', 
			type: 'POST',	
			data: data, 
			cache: false,
			dataType: 'json',
			processData: false, 
			contentType: false, 
			success: function(data, textStatus, jqXHR) {
				if(typeof(data.error) === 'undefined') {
					var cnt = parseInt(str_replace(",", "", $(".favStoreCnt_" + vendor).html()));
					if(data.success == 1) {					
						$(".favStoreCnt_" + vendor).html(number_format(cnt + 1));
						$(".btnFavStore2_" + vendor).addClass("colorOrange");
						alertify.success("관심스토어에 등록되었습니다.");
					}
					else {
						$(".favStoreCnt_" + vendor).html(number_format(cnt - 1));
						$(".btnFavStore2_" + vendor).removeClass("colorOrange");
						alertify.success("관심스토어에서 삭제되었습니다.");
					}				
				}
				else {
					alertify.error(data.error);
				}
			},
			error: function(jqXHR, textStatus, errorThrown) {
				alertify.error(textStatus);
			}		
		});
	}

	function timelinyResetCallBackSub() {
		$('.btnFavStore').unbind('click').bind('click',function(e) {			
			if(isLogin == 0) {
				window.location.href = "{{Main}}?channel=login&channel2=store_list";
				return;
			}
			var id = $(this).attr('data-id');			
			if(id) addFavoriteStore2(id);
		});
	}

	timelinyResetCallBackSub();
	
// -->
</script>
