<div id="listArea">
	<!-- DYNAMIC @is_list_area@ -->
	<table class="listIn fixed-header">
	<colgroup>
	<col width="8%" /> 
	<col width="10%" />
	<col width="56%" />
	<col width="12%" />
	<col width="14%" />
	</colgroup>
	<thead> 
	<tr> 
		<th>번호</th>			
		<th>답변</th>
		<th>제목</th>	
		<th>작성자</th>	
		<th>등록일</th>
	</tr>
	</thead>
	<tbody>
	<!-- DYNAMIC @loop_list@ -->			
	<tr class="listTitle listSubject" data-num='{{UID}}' data-uid="{{UID}}" data-secret="{{SECRET}}">
		<td class="num">{{NUM}}</td>
		<td>{{ANSWER_TYPE}}</td>
		<td class="tleft">
			<!-- DYNAMIC @is_secret@ -->
			<i class="xi-lock-o xi-x" title="비밀글"></i>
			<!-- DYNAMIC @is_secret@ -->
			{{SUBJECT}}</td>
		<td>{{NAME}}</td>
		<td class="num">{{SIGNDATE}}</td>
	</tr>
	<tr>
		<td colspan="5" class="content content{{UID}}">
			<div class="inquiry">
				<div class="title">Q</div>
				<div class="content">					
					{{CONTENT}}
					<!-- DYNAMIC @is_attach@ -->
					<div class="image" data-uid="{{UID}}">
						<!-- DYNAMIC @loop_attach@ -->
						<img src="image/inquiry/{{attach_name}}" alt="" />
						<!-- DYNAMIC @loop_attach@ -->
					</div>
					<!-- DYNAMIC @is_attach@ -->					
				</div>
				<!-- DYNAMIC @is_answer@ -->	
				<div class="empty20"></div>
				<div class="title">A</div>
				<div class="content">					
					{{ANSWER}}		
				</div>
				<!-- DYNAMIC @is_answer@ -->	
			</div>
		</td>
	<tr>
	<!-- DYNAMIC @loop_list@ -->
	<!-- DYNAMIC @empty_list@ -->
	<tr>
		<td colspan="5" class="emptyList">등록된 상품문의가 없습니다.</td>
	<tr>
	<!-- DYNAMIC @empty_list@ -->
	</tbody>
	</table>
	</form>
	<!-- DYNAMIC @is_list_area@ -->
</div>
