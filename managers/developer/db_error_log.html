<div class="content">
	
	<form name='searchForm' method='get' action='{{PHP_SELF}}' >
	<div class="searchBox">
		<div class="floatLeft">
			<select name="field">
				<option value="multi">통합검색</option>
				<option value="id">아이디</option>
				<option value="name">파일명</option>
			</select>			
		</div>
		<div class="searchBoxIn">
			<input type="text" name="keyword" value="{{keyword}}" data-search-btn="1" data-on-enter="1" />
			<p class="resetIcon resetIconBtn"><i class="xi-undo masterTooltip" title="초기화"></i></p>
		</div>

		<div class="expensionArrow">
			<div class="box"></div>
			<i class="xi-arrow-down box_down"></i>			
		</div>
	</div>
	<div class="searchDetail">
		<div class="searchDetailBox">
			<table class="search">
			<colgroup>
			<col width="33%" /> 
			<col width="33%" />
			<col width="33%" /> 
			</colgroup>
			<tr> 
				<td colspan="3">
					<select name="date_type" style="display:none;">
						<option value="">등록일</option>
					</select>						
					<div class="requireLeft"><input type="text" name="s_date" class="ip2 dates" value="{{s_date}}" data-date-picker='1' /></div>
					<div class="floatLeft" style="padding:0 0 0 15px;">~</div>
					<div class="requireLeft"><input type="text" name="e_date" class="ip2 dates" value="{{e_date}}" data-date-picker='1' /></div>
					<div class="floatLeft" style="padding-left:15px;">
						<button class="btns2" type="button" data-s_date='{{DATE1}}' data-e_date='{{DATE1}}'>오늘</button>
						<button class="btns2" type="button" data-s_date='{{DATE2}}' data-e_date='{{DATE1}}'>3일</button>
						<button class="btns2" type="button" data-s_date='{{DATE3}}' data-e_date='{{DATE1}}'>7일</button>
						<button class="btns2" type="button" data-s_date='{{DATE4}}' data-e_date='{{DATE1}}'>1개월</button>
						<button class="btns2" type="button" data-s_date='{{DATE5}}' data-e_date='{{DATE1}}'>3개월</button>						
						<button class="btns2" type="button" data-s_date='' data-e_date=''>전체</button>					
					</div>
				</td>
			</tr>	
			<tr>				
				<td>
					<select name="status" style="display:none;">
						<option value="">처리상태</option>
						<option value='0'>오류접수</option>
						<option value='1'>처리완료</option>
					</select>							
				</td>				
				<td></td>
				<td></td>
			</tr>
			</table>					
		</div>	
		<div class="btnSearchSubmitBox">
			<div class="btnCircleSearch"><div class="btnCircleSearchTitle">검색</div><i class="xi-search xi-x"></i></div>
			<div class="btnCircleReset"><div class="btnCircleResetTitle">초기화</div><i class="xi-undo xi-x"></i></div>						
		</div>
	</div>
	</form>

	<script>
	<!--	
		$("form[name=searchForm] select[name='field']").val('{{field}}').heapbox({'width' : '200px'});
		$("form[name=searchForm] select[name='date_type']").val('').show().heapbox({'width' : '170px'});
		$("form[name=searchForm] select[name='status']").val('{{status}}').show().heapbox({'width' : '100%'});
		
		$('.searchDetail').hide();
	//-->
	</script>

	<div class="empty60"></div>
	
	<div class="listTop">
		<form name='listSearchForm' method='get' action='{{PHP_SELF}}?{{searchstring}}' />
		<div class="listLeft size14">
			전체 : <b class="orange">{{ATOTAL}}</b>건 
			<!-- DYNAMIC @is_search@ -->
			, 검색 : <b class="orange">{{TOTAL}}</b>건
			<!-- DYNAMIC @is_search@ -->
		</div>
		<div class="listRight size10">
			<div class="floatLeft">
				<select name="sort">
					<option value="uid DESC">발생일 역순</option>
					<option value="uid ASC">발생일 순</option>	
				</select>
				&nbsp;&nbsp;
			</div>
			<div class="floatLeft">				
				<select name="limit">
					<option value="10">10개 보기</option>
					<option value="20">20개 보기</option>
					<option value="30">30개 보기</option>
					<option value="40">40개 보기</option>
					<option value="50">50개 보기</option>
					<option value="60">60개 보기</option>
					<option value="70">70개 보기</option>
					<option value="80">80개 보기</option>
					<option value="90">90개 보기</option>
					<option value="100">100개 보기</option>
				</select>
			</div>
		</div>
		</form>
	</div>

	<div class="empty10"></div>
	<div class="listLine"></div>
	<div class="listSelect" style="width:46%;">
		<div class="floatLeft">
			<button class="graButtonWhite secDelete" type="button"><span class="text"><i class="xi-file-check-o xi-x"></i> 선택삭제</span></button>
		</div>

		<form name='modifyForm1' />
		<div class="firstLine">			
			<select name="status">					
				<option value=''>선택 처리상태 변경</option>
				<option value='2'>오류접수</option>
				<option value='1'>처리완료</option>
			</select>			
			<script>
				$("form[name=modifyForm1] select[name='status']").heapbox({
					'width' : '195px', 
					'zindex' : 2,
					'onChange': function(value){
										if(!value) return;
										statusProc(value);
									}
				});
			</script>
		</div>
		</form>
	</div>

	<div id="listArea">
		<!-- DYNAMIC @is_list_area@ -->
		<form name="listForm" method="post" action='db_error_log_post.php?{{addstring}}' target='HFrm'>
		<input type="hidden" name="mode" />
		<input type="hidden" name="value" />
		<table class="listIn fixed-header">
		<colgroup>
		<col width="4%" />		<!-- 선택 --> 
		<col width="5%" />		<!-- 번호 --> 
		<col width="12%" />		<!-- 아이디 --> 
		<col width="20%" />		<!-- 파일명 --> 
		<col width="39%" />		<!-- 메모 --> 
		<col width="9%" />		<!-- 처리상태 --> 
		<col width="14%" />		<!-- 발생일 --> 
		</colgroup>
		<thead> 
		<tr> 
			<th><label><input type='checkbox' name="check_all" id="check_all" value="1" /><span></span></label></th>
			<th>번호</th>
			<th>회원정보 <i class="xi-focus-frame"></i></th>
			<th>파일명</th>
			<th>메모</th>
			<th>처리상태</th>
			<th>발생일</th>			
		</tr>
		</thead>
		<tbody>
		<!-- DYNAMIC @loop_list@ -->		
		<tr>
			<td><label><input type='checkbox' name="item[]" value="{{UID}}" class="ckeckItem" /><span></span></label></td>
			<td class="number">{{NUM}}</td>
			<td>
				{{MEMBER_NAME}}
				<!-- DYNAMIC @is_member@ -->
				<center>
				<div class='btnCrm cursorPoint' data-id='{{MEMBER_ID}}'>
					<div class="empty5"></div>
					<div class='barId'>{{MEMBER_ID}}</div>
					<div class="empty5"></div>
					<div class='barName2'>{{MEMBER_LEVEL}}</div>
				</div>
				</center>
				<!-- DYNAMIC @is_member@ -->
			</td>	
			<td style="text-align:left">{{NAME}}</td>
			<td style="text-align:left; font-size:12px;">{{MESSAGE}}</td>
			<td>{{STATUS}}</td>
			<td class="number">{{SIGNDATE}}</td>			
		</tr>
		<!-- DYNAMIC @loop_list@ -->
		<!-- DYNAMIC @empty_list@ -->
		<tr>
			<td colspan="7" class="emptyList"><i class="fas fa-quote-left"></i>&nbsp;&nbsp;등록(검색)된 디비오류 로그가 없습니다!&nbsp;&nbsp;<i class="fas fa-quote-right"></i></td>
		<tr>
		<!-- DYNAMIC @empty_list@ -->
		</tbody>
		</table>
		</form>
		<!-- DYNAMIC @is_list_area@ -->
	</div>

	<div class="listSelectB" style="width:46%;">
		<div class="floatLeft">
			<button class="graButtonWhite secDelete" type="button"><span class="text"><i class="xi-file-check-o xi-x"></i> 선택삭제</span></button>
		</div>

		<form name='modifyForm2' />
		<div class="firstLine">			
			<select name="status">					
				<option value=''>선택 처리상태 변경</option>
				<option value='2'>오류접수</option>
				<option value='1'>처리완료</option>
			</select>			
			<script>
				$("form[name=modifyForm2] select[name='status']").heapbox({
					'width' : '195px', 
					'zindex' : 2,
					'onChange': function(value){
										if(!value) return;
										statusProc(value);
									}
				});
			</script>
		</div>
		</form>
	</div>
	<div class="listSelectRB"></div>
	<div class="listLineB"></div>

	<div class="paging">{{PAGING}}</div>

</div>

<script src="../../lib/jquery.timeliny.js?ver={{ver}}"></script>
