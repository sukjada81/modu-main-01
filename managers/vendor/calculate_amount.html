			});

	function addCalculate() {
		var	cnts	= $('.infos').length;
		var s_date	= "{{s_date}}";
		var e_date	= "{{e_date}}";

		var arr		= new Array(); 		
       
		$('.infos').each(function(i) {			
			var id		= $(this).attr('data-id');
			var sum		= $(this).attr('data-sum');
			var price1	= $(this).attr('data-sum1');
			var price2	= $(this).attr('data-sum2');
			var price3	= $(this).attr('data-sum3');

			if(!(sum == 0 && price1 == 0 && price2 == 0 && price3 == 0)) {
				var obj		= new Object();
				obj.id		= id;
				obj.sum		= sum;
				obj.price1	= price1;
				obj.price2	= price2;
				obj.price3	= price3;

				arr.push(obj);
			}
		});

		if(arr.length > 0) {

			items = JSON.stringify(arr);
		
			var data = new FormData();
			data.append('s_date',	s_date);
			data.append('e_date',	e_date);
			data.append('items',	items);		

			$.ajax({
					url: 'calculate_post_json.php', 
					type: 'POST',
					data: data, 
					cache: false,
					dataType: 'json',
					processData: false, 
					contentType: false, 
					success: function(data, textStatus, jqXHR) {					
						if(typeof(data.error) === 'undefined') {							
							alertify.success("정산내역에 등록 되었습니다.");
							window.location.href = 'calculate_list.php';
							return;
						}
						else {
							alertify.error(data.error);
						}
					},
					error: function(jqXHR, textStatus, errorThrown) {
						alertify.error(textStatus);
					}		
			});	
		}
		else {
			alertify.success("변경된 사항이 없습니다.");
		}		
	}
	
	$(function() {

	});
