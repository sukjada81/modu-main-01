<link href="../../lib/summernote-lite.css?ver={{ver}}" rel="stylesheet">
<script src="../../lib/summernote-lite.js?ver={{ver}}"></script>
<script src="../../lib/summernote-ko-KR.js"></script>

<form name='goodsForm' method='post' action='popup_post.php?{{addstring}}' enctype="multipart/form-data" target='HFrm'>
<input type="hidden" name="mode" value="{{mode}}" />
<input type="hidden" name="uid" value="{{uid}}" />
<input type="hidden" name="temp_upload" value="{{temp_upload}}" />

<div class="content">

	<div class="contentTitle">
		<i class="xi-file-text xi-x"></i>&nbsp;&nbsp;팝업 {{TTL}}
	</div>

	<table>
	<colgroup>
	<col width="16%" /> 
	<col width="34%" />
	<col width="16%" /> 
	<col width="34%" />	
	</colgroup>
	<tr> 
		<td>팝업명</td>
		<td colspan="3"><p style="position:relative"><input type='text' value='{{name}}' style="width:98%" required="required" data-msg="팝업명을" data-toname="name" /></p></td>
	</tr>
	<tr> 
		<td>상태</td>
		<td colspan="3">
			<div>
				<label><input type='radio' name="status" value="0" {{checked_status_0}} /><span class="radio"></span> 사용함</label>&nbsp;&nbsp;
				<label><input type='radio' name="status" value="1" {{checked_status_1}} /><span class="radio"></span> 사용안함</label>&nbsp;&nbsp;
				<label><input type='radio' name="status" value="2" {{checked_status_2}} disabled="disabled" /><span class="radio"></span> 기간종료</label>
			</div>
		</td>
	</tr>
	<tr> 
		<td>형태</td>
		<td colspan="3">
			<div>
				<label><input type='radio' name="type" value="0" {{checked_type_0}} /><span class="radio"></span> 항상</label>&nbsp;&nbsp;
				<label><input type='radio' name="type" value="1" {{checked_type_1}} /><span class="radio"></span> 하루에 한번</label>
			</div>
		</td>
	</tr>
	<tr > 
		<td>기간</td>
		<td>
			<div>
				<label><input type='radio' name="period" value="0" {{checked_period_0}} /><span class="radio"></span> 무기한</label>&nbsp;&nbsp;
				<label><input type='radio' name="period" value="1" {{checked_period_1}} /><span class="radio"></span> 특정기간</label>
			</div>			
		</td>
		<td>기간입력 <i class="xi-help xi-x colorDGary masterTooltip" title="기간은 시작일 00:00:00 ~ 종료일 23:59:59 까지 적용 됩니다."></i></td>
		<td>
			<div class="requireLeft"><input type="text" name="s_date" value="{{s_date}}" class="ip3 dates" placeholder="시작일" data-msg="시작일을" data-date-picker='2'  /></div>
			<div class="floatLeft" style="padding:0 0 0 15px;">~</div>
			<div class="requireLeft"><input type="text" name="e_date" value="{{e_date}}" class="ip3 dates" placeholder="종료일" data-msg="종료일을" data-date-picker='2' /></div>
			<div class="floatLeft" style="padding-left:15px;">
		</td>
	</tr>
	<tr > 
		<td>위치 <i class="xi-help xi-x colorDGary masterTooltip" title="- 동일위치에 등록된 팝업은 멀티팝업을 이용하여 한번에 노출 됩니다.[BR]- 하단일 경우 이미지사이즈가 100%로 노출 됩니다."></i></td>
		<td colspan="3">
			<select name="position">				
				<option value="8">하단</option>			
			</select>			
			<script>
				$("form[name=goodsForm] select[name='position']").val('{{position}}').heapbox({'width' : '300px', 'onChange': function(value){ ckPositionck() } });
			</script>		
		</td>		
	</tr>
	<tr> 
		<td>내용 </td>
		<td colspan="3" style="padding:20px;">
			<div class="contentMenuDetail">		
				<ul>
					<li class="contentMenuDetailSub selected" id="contentMenuDetailSub1">이미지로 등록</li>
					<li class="contentMenuDetailSub" id="contentMenuDetailSub2">내용직접 등록</li>
				</ul>
				<div class="contentBarDetail left"></div>
				<div class="contentBarDetail right"></div>

				<input type="hidden" name="image_only" value="{{image_only}}" />

				<script>
					var a = 100 / parseInt($(".contentMenuDetail ul li").length);
					$(".contentMenuDetailSub").css({'width':'calc('+a+'% - 2px)'});
				
					$('.contentMenuDetailSub').hover(function(e){		
						var left = $(this).position().left;
						var right = parseInt(left + parseInt($(this).css('width'))) + 1; 

						$(".contentMenuDetail .left").css({left:left}).show();
						$(".contentMenuDetail .right").css({left:right}).show();						
					}, 
					function() {
						$(".contentMenuDetail .left").hide();
						$(".contentMenuDetail .right").hide();
					});			
					
					$('.contentMenuDetailSub').click(function(e){
						var nameArr2 = new Array('size_x','size_y');

						if(!$(this).hasClass('selected')) {
							$('.contentMenuDetailSub').removeClass('selected');
							$(this).addClass('selected');
							if($(this).prop('id')=='contentMenuDetailSub1'){
								$('.detailEditer').hide(); 
								$("form[name=goodsForm] input[name='image_only']").val('1');
								$('.detailImage').show();

								if('{{write_require}}' != '') $("form[name=goodsForm] input[name='image1']").attr('required', true);
								$("form[name=goodsForm] input[name='content']").attr('required', false);
								
								for(i=0;i<nameArr2.length;i++) {
									dipslayDarkHide('form[name=goodsForm] input[name='+nameArr2[i]+']');
								}	
								resetContent();
							}
							else {
								$('.detailEditer').show(); 
								$("form[name=goodsForm] input[name='image_only']").val('0');
								$('.detailImage').hide();

								$("form[name=goodsForm] input[name='image1']").attr('required', false);
								$("form[name=goodsForm] input[name='content']").attr('required', true);
								
								for(i=0;i<nameArr2.length;i++) {
									dipslayDarkShow('form[name=goodsForm] input[name='+nameArr2[i]+']');
								}
								resetTooltip();
								resetContent();

							}
						}							
					})
				</script>
			</div>
			
			<div class="detailImage">
				<div class="floatLeft">
					<div class="btnBox2" >
						<div id="btn_image" class="btnBoxIcon">
							<i class="fas fa-plus-circle fa-2x"></i>											
						</div>												
						<input type="file" name="image1" class="imageBtn" {{write_require}} data-msg="이미지를" data-num="1" />
						<img id="image1" alt="목록이미지" src="../common/img/blank.gif" />
						<div id="btn2_image1" class="btnBoxIcon2" data-num="1">
							<i class="fas fa-edit masterTooltip btnImgEdit" title="변경하기"></i>						
						</div>
					</div>
				</div>
				<div class="floatLeft" style="padding:0px 0 0 20px; width:calc(100% - 422px)">
					<p style="position:relative"><input type='text' name='link1' value='{{link1}}' style="width:98%" placeholder="링크주소" data-on-enter="1" /></p>
				</div>
				
			</div>

			<div class="detailEditer">
				<div class="sn_content">{{content}}</div>	
				<input type="hidden" name="content" value= "" required="required" data-notefor=".sn_content" />
			</div>
		</td>
	</tr>
	<tr> 
		<td>창크기 입력 <i class="xi-help xi-x colorDGary masterTooltip" title="이미지로 등록시 이미지사이즈로 노출 됩니다."></i></td>
		<td colspan="3">
			<div class="requireLeft"><input type="text" name="size_x" value="{{size_x}}" class="only_num" style="width:100px; font-size:14px;" placeholder="가로사이즈" required="required" data-msg="가로사이즈를" /> px, </div>
			<div class="requireLeft"><input type="text" name="size_y" value="{{size_y}}" class="only_num" style="width:100px; font-size:14px;" placeholder="세로사이즈" required="required" data-msg="세로사이즈를" /> px</div>
		</td>
	</tr>
	</table>
	
	<div class="empty60" ></div>

	<div class="btnSubmitBox">
		<div class="displayInline"><button class="weight300 shine" type="submit">팝업 {{TTL}}하기</button></div>
		<div class="btnPrev"><i class="xi-arrow-left xi-x"></i></div>
		<div class="btnPrevTitle">이전페이지</div>		
	</div>

</div>

</form>
