<div class="content">
	
	<form name='searchForm' method='get' action='{{PHP_SELF}}'>
	<div class="searchBox">
		<div class="floatLeft">
			<select name="field">
				<option value="name">배너명</option>
			</select>			
		</div>
		<div class="searchBoxIn">
			<input type="text" name="keyword" value="{{keyword}}" data-search-btn="1" data-on-enter="1" />
			<p class="resetIcon resetIconBtn"><i class="xi-undo masterTooltip" title="초기화"></i></p>
		</div>

		<div class="expensionArrow">
			<div class="box"></div>
			<i class="xi-arrow-down box_down"></i>			
		</div>
	</div>
	<div class="searchDetail">
		<div class="searchDetailBox">
			<table class="search">
			<colgroup>
			<col width="33%" /> 
			<col width="33%" />
			<col width="33%" /> 
			</colgroup>
			<tr> 
				<td>
					<select name="code">
						<option value="">출력위치</option>
						<!-- DYNAMIC @loop_code@ -->
						<option value="{{CODE}}">{{TITLE}}</option>
						<!-- DYNAMIC @loop_code@ -->
					</select>							
				</td>
				<td>
					<select name="status">
						<option value="">상태</option>
						<option value="0">사용함</option>
						<option value="1">사용안함</option>						
					</select>							
				</td>
				<td>
					<select name="target">
						<option value="">링크 이동</option>
						<option value="0">현재창</option>
						<option value="1">새창</option>
					</select>						
				</td>				
			</tr>			
			</table>					
		</div>	
		<div class="btnSearchSubmitBox">
			<div class="btnCircleSearch"><div class="btnCircleSearchTitle">검색</div><i class="xi-search xi-x"></i></div>
			<div class="btnCircleReset"><div class="btnCircleResetTitle">초기화</div><i class="xi-undo xi-x"></i></div>						
		</div>
	</div>
	</form>

	<script>
	<!--	
		$("form[name=searchForm] select[name='field']").val('{{field}}').heapbox({'width' : '200px'});
		$("form[name=searchForm] select[name='code']").val('{{code}}').heapbox({'width' : '91%'});
		$("form[name=searchForm] select[name='status']").val('{{status}}').heapbox({'width' : '91%'});
		$("form[name=searchForm] select[name='target']").val('{{target}}').heapbox({'width' : '91%'});
		
		$('.searchDetail').hide();
	//-->
	</script>

	<div class="empty60"></div>
	
	<div class="listTop">
		<form name='listSearchForm' method='get' action='{{PHP_SELF}}?{{searchstring}}' />
		<div class="listLeft size14">
			전체 : <b class="orange">{{ATOTAL}}</b>건 
			<!-- DYNAMIC @is_search@ -->
			, 검색 : <b class="orange">{{TOTAL}}</b>건
			<!-- DYNAMIC @is_search@ -->
		</div>
		<div class="listRight size10">
			<!-- DYNAMIC @is_default@ -->
			<div class="floatLeft">
				<select name="sort">
					<option value="uid DESC">등록일 역순</option>
					<option value="uid ASC">등록일 순</option>					
				</select>
				&nbsp;&nbsp;
			</div>
			<div class="floatLeft">				
				<select name="limit">
					<option value="10">10개 보기</option>
					<option value="20">20개 보기</option>
					<option value="30">30개 보기</option>
					<option value="40">40개 보기</option>
					<option value="50">50개 보기</option>
					<option value="60">60개 보기</option>
					<option value="70">70개 보기</option>
					<option value="80">80개 보기</option>
					<option value="90">90개 보기</option>
					<option value="100">100개 보기</option>
				</select>
			</div>
			<!-- DYNAMIC @is_default@ -->
			<!-- DYNAMIC @is_sort1@ -->
			<i class="xi-arrows xi-x colorDGary masterTooltipR" title="등록된 항목을 마우스로 누르고 아래 위로 이동하시면 순서를 변경 하실 수 있습니다."></i>			
			<!-- DYNAMIC @is_sort1@ -->			
		</div>
		</form>
	</div>

	<div class="empty10"></div>
	<div class="listLine"></div>
	<div class="listSelect">
		<button class="graButtonWhite secDelete" type="button"><span class="text"><i class="xi-file-check-o xi-x"></i> 선택삭제</span></button>
	</div>

	<div class="listSelectR">
		<button class="graident1 graButton btnWrite" type="button"><i class="fas fa-link"></i> 배너등록</button>
	</div>
	
	<div id="listArea">
		<!-- DYNAMIC @is_list_area@ -->
		<form name="listForm" method="post" action='banner_post.php?{{addstring}}' target='HFrm'>
		<input type="hidden" name="mode" />
		<input type="hidden" name="list_order" value="" />
		<table class="listIn fixed-header" id="bannerSortable">
		<colgroup>
		<col width="5%" />		<!-- 선택 --> 
		<col width="5%" />		<!-- 번호 --> 
		<col width="10%" />		<!-- 출력위치 --> 
		<col width="20%" />		<!-- 배너 --> 
		<col width="34%" />		<!-- 배너명 / 노출기간 --> 
		<col width="8%" />		<!-- 상태 --> 
		<col width="10%" />		<!-- 등록일 --> 
		<col width="8%" />		<!-- 링크 --> 
		<col width="5%" />		<!-- 처리 --> 
		</colgroup>
		<thead> 
		<tr> 
			<th><label><input type='checkbox' name="check_all" id="check_all" value="1" /><span></span></label></th>
			<th>{{TTL1}}</th>
			<th>출력위치 <i class="xi-link"></i></th>
			<th>배너</th>
			<th>배너명 <i class="xi-link"></i> / 노출기간</th>
			<th>상태</th>
			<th>등록일</th>
			<th>링크</th>
			<th>처리</th>
		</tr>
		</thead>
		<tbody>
		<!-- DYNAMIC @loop_list@ -->		
		<tr data-idx="{{UID}}" class="target">
			<td><label><input type='checkbox' name="item[]" value="{{UID}}" class="ckeckItem" /><span></span></label></td>
			<td class="number numAsc" data-num='{{NUM_ASC}}'>{{NUM}}</td>
			<td>{{CODE}}</td>
			<td><img src="{{image_folder}}/{{UID}}/{{IMAGE1}}?t={{MODDATE}}" alt="배너이미지" width="100%" /></td>
			<td style="text-align:left">
				<div><a href="banner_info.php?mode=modify&uid={{UID}}{{addstring}}" title="수정하기" class="underLine">{{NAME}}</a></div>
				<div class="category">{{S_DATE}}</div>
			</td>
			<td>{{STATUS}}</td>
			<td class="number">{{SIGNDATE}}</td>
			<td><a href="{{LINK1}}" target="_blank"><i class="fas fa-desktop masterTooltip" title="링크"></i></a></td>
			<td><i class="fas fa-edit masterTooltip" title="수정하기" onclick="window.location.href='banner_info.php?mode=modify&uid={{UID}}{{addstring}}'"></i></td>		
		</tr>
		<!-- DYNAMIC @loop_list@ -->
		<!-- DYNAMIC @empty_list@ -->
		<tr>
			<td colspan="9" class="emptyList"><i class="fas fa-quote-left"></i>&nbsp;&nbsp;등록(검색)된 배너가 없습니다!&nbsp;&nbsp;<i class="fas fa-quote-right"></i></td>
		<tr>
		<!-- DYNAMIC @empty_list@ -->
		</tbody>
		</table>
		</form>
		<!-- DYNAMIC @is_list_area@ -->
	</div>

	<div class="listSelectB"></div>
	<div class="listSelectRB"></div>
	<div class="listLineB"></div>

	<div class="paging">{{PAGING}}</div>

</div>
