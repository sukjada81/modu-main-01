	<script>
	$(".subMenuIcon").click(function() {
		$m = $(this).parent('div').parent('li').children("ul");
		if($m.css('opacity')==1) {
			$m.animate({height: 'hide', opacity:0});
			if($(this).hasClass("rotate180")) $(this).addClass('rotate180r');			
			$(this).removeClass('rotate180');
		}
		else {
			$m.animate({height: 'show', opacity:1});
			$(this).removeClass('rotate180r').addClass('rotate180');
		}	
	});

	if('{{MENU_SUB_SEC}}' != '') $('.subMenuIcon').trigger('click').trigger('click');
	</script>
