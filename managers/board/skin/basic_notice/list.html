	<form name='searchForm' method='get' action='{{PHP_SELF}}'>
	<input type="hidden" name="b_id" value="{{b_id}}" />
	<div class="searchBox">
		<div class="floatLeft">
			<select name="field">
				<option value="S">제목</option>
				<option value="C">내용</option>
				<option value="SC">제목 + 내용</option>
			</select>			
		</div>
		<div class="searchBoxIn">
			<input type="text" name="keyword" value="{{keyword}}" data-search-btn="1" data-on-enter="1" />
			<p class="resetIcon resetIconBtn"><i class="xi-undo masterTooltip" title="초기화"></i></p>
		</div>		
	</div>	
	</form>

	<script>
	<!--	
		$("form[name=searchForm] select[name='field']").val('{{field}}').heapbox({'width' : '200px'});				
	//-->
	</script>

	<div class="empty60"></div>

	<!-- DYNAMIC @is_cate@ -->
	<div id="contentMenu" class="contentMenu">
		<ul>
			<li class="contentMenuSub {{cate_selected_all}}" data-link="">전체</li>
			<!-- DYNAMIC @loop_cate@ -->
			<li class="contentMenuSub {{cate_selected}}" data-link="{{cate_num}}">{{cate_name}}</li>
			<!-- DYNAMIC @loop_cate@ -->
		</ul>
		<div class="contentBar left"></div>
		<div class="contentBar right"></div>

		<script>
			var a = 100 / parseInt($("#contentMenu ul li").length);
			$("#contentMenu .contentMenuSub").css({'width':'calc('+a+'% - 2px)'});
		
			$('#contentMenu .contentMenuSub').hover(function(e){		
				if(!$(this).hasClass('selected')) {
					var left = $(this).position().left;
					var right = parseInt(left + parseInt($(this).css('width'))) + 2; 

					$("#contentMenu .left").css({left:left}).show();
					$("#contentMenu .right").css({left:right}).show();
				}
			}, 
			function() {
				$("#contentMenu .left").hide();
				$("#contentMenu .right").hide();
			});

			$('#contentMenu .contentMenuSub').click(function(e){
				var link =$(this).attr('data-link');
				if(link)	window.location.href = "{{DEFAULT_LINK}}&cate=" + link;
				else		window.location.href = "{{DEFAULT_LINK}}";
			});
			
		</script>
	</div>
	<div class="empty60"></div>
	<!-- DYNAMIC @is_cate@ -->	
	
	<div class="listTop">
		<form name='listSearchForm' method='get' action='{{PHP_SELF}}?{{searchstring}}' />
		<div class="listLeft size14">
			전체 : <b class="orange">{{TOTAL}}</b>건 
			<!-- DYNAMIC @is_search@ -->
			, 검색 : <b class="orange">{{TOTAL}}</b>건
			<!-- DYNAMIC @is_search@ -->
		</div>
		<div class="listRight size10">
			<div class="floatLeft">				
				<select name="limit">
					<option value="10">10개 보기</option>
					<option value="20">20개 보기</option>
					<option value="30">30개 보기</option>
					<option value="40">40개 보기</option>
					<option value="50">50개 보기</option>
					<option value="60">60개 보기</option>
					<option value="70">70개 보기</option>
					<option value="80">80개 보기</option>
					<option value="90">90개 보기</option>
					<option value="100">100개 보기</option>
				</select>
			</div>
		</div>
		</form>
	</div>

	<div class="empty10"></div>
	<div class="listLine"></div>
	<div class="listSelect">
		<button class="graButtonWhite secDelete" type="button"><span class="text"><i class="xi-file-check-o xi-x"></i> 선택삭제</span></button>
	</div>

	<!-- DYNAMIC @is_write@ -->
	<div class="listSelectR">
		<button class="graident1 graButton btnWrite" type="button"><i class="fas fa-link"></i> 글쓰기</button>
	</div>
	<!-- DYNAMIC @is_write@ -->

	<div id="listArea">
		<!-- DYNAMIC @is_list_area@ -->
		<form name="listForm" method="post" action='board_post.php?{{addstring}}' target='HFrm'>
		<input type="hidden" name="mode" />
		<input type="hidden" name="b_id" value="{{b_id}}" />
		<table class="listIn fixed-header">
		<colgroup>
		<col width="5%" />		<!-- 선택 --> 
		<col width="5%" />		<!-- 번호 --> 
		<col width="68%" />		<!-- 게시판아이디 -->
		<col width="10%" />		<!-- 조회수 -->
		<col width="12%" />		<!-- 등록일 --> 		
		</colgroup>
		<thead> 
		<tr> 
			<th><label><input type='checkbox' name="check_all" id="check_all" value="1" /><span></span></label></th>
			<th>번호</th>
			<th>제목 <i class="xi-link"></i></th>
			<th>조회수</th>				
			<th>등록일</th>
		</tr>
		</thead>
		<tbody>
		<!-- DYNAMIC @loop_list@ -->		
		<tr>
			<td><label><input type='checkbox' name="item[]" value="{{UID}}" class="ckeckItem" /><span></span></label></td>
			<td class="number">{{NUM}}</td>
			<td style="text-align:left">
				<!-- DYNAMIC @is_notice@ -->
				<i class="xi-lightbulb-o xi-x" title="공지"></i>
				<!-- DYNAMIC @is_notice@ -->
				<!-- DYNAMIC @is_secret@ -->
				<i class="xi-lock-o xi-x" title="비밀글"></i>
				<!-- DYNAMIC @is_secret@ -->
				<!-- DYNAMIC @is_depth@ -->
				{{EMPTY}}<i class="xi-subdirectory-arrow xi-x"></i>
				<!-- DYNAMIC @is_depth@ -->
				<a href="{{DEFAULT_LINK}}&b_mode=view&uid={{UID}}{{addstring}}" class="link">{{SUBJECT}}</a>
				<!-- DYNAMIC @is_delete_article@ -->
				삭제된 글입니다.
				<!-- DYNAMIC @is_delete_article@ -->
				<!-- DYNAMIC @is_new_icon@ -->
				<i class="xi-new xi-x"></i>
				<!-- DYNAMIC @is_new_icon@ -->
				<!-- DYNAMIC @is_comment@ -->
				<i class="xi-message xi-x"></i> <span class="num">{{COMMENT_COUNT}}</span>
				<!-- DYNAMIC @is_comment@ -->				
			</td>		
			<td class="number">{{COUNT}}</td>
			<td class="number">{{SIGNDATE}}</td>
		</tr>
		<!-- DYNAMIC @loop_list@ -->
		<!-- DYNAMIC @empty_list@ -->
		<tr>
			<td colspan="5" class="emptyList"><i class="fas fa-quote-left"></i>&nbsp;&nbsp;등록(검색)된 글이 없습니다.&nbsp;&nbsp;<i class="fas fa-quote-right"></i></td>
		<tr>
		<!-- DYNAMIC @empty_list@ -->
		</tbody>
		</table>
		</form>
		<!-- DYNAMIC @is_list_area@ -->
	</div>

	<div class="listSelectB"></div>
	<div class="listSelectRB"></div>
	<div class="listLineB"></div>

	<div class="paging">{{PAGING}}</div>

</div>
