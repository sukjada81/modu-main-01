<div class="content_view">
	
	<div class="title">
		<!-- DYNAMIC @is_cate_name@ -->
		[{{cate_name}}]
		<!-- DYNAMIC @is_cate_name@ -->
		<!-- DYNAMIC @is_notice@ -->
		<i class="xi-lightbulb-o xi-x" title="공지"></i>
		<!-- DYNAMIC @is_notice@ -->
		{{subject}}
		<span>{{date}}</span>
	</div>

	<!-- DYNAMIC @loop_adds@ -->
	<div class="adds">
		<span>{{add_title}}</span>{{add_value}}
	</div>	
	<!-- DYNAMIC @loop_adds@ -->
	
	<!-- DYNAMIC @is_attach@ -->
	<div class="attach">
		<!-- DYNAMIC @loop_attach@ -->
		<span data-name='{{{{attach_name}}'>{{attach_name}} ({{attach_size}}) <i class="xi-download xi-x"></i></span>
		<!-- DYNAMIC @loop_attach@ -->
	</div>
	<form name='downForm' method='post' action='../../board/download.php' target='HFrm'>
	<input type="hidden" name="b_id" value="{{b_id}}" />
	<input type="hidden" name="uid" value="{{uid}}" />
	<input type="hidden" name="name" value="" />
	</form>
	<!-- DYNAMIC @is_attach@ -->

	<!-- DYNAMIC @is_links@ -->
	<div class="links">
		<!-- DYNAMIC @loop_links@ -->
		<span><a href="{{link_url}}" target="_blank">{{link_url}} <i class="xi-external-link xi-x"></i></a></span>
		<!-- DYNAMIC @loop_links@ -->
	</div>	
	<!-- DYNAMIC @is_links@ -->

	<div class="contents">{{content}}</div>

	<div class="listBtnL">
		<button class="graident1 graButton btnList" style="width:120px" type="button"><span class="text"><i class="xi-list xi-x"></i> 글목록</span></button>
		<!-- DYNAMIC @is_write@ -->
		<button class="graident2 graButton btnWrite" style="width:120px" type="button"><span class="text"><i class="xi-document xi-x"></i> 글쓰기</span></button>		
		<!-- DYNAMIC @is_write@ -->
		<!-- DYNAMIC @is_reply@ -->
		<button class="graident3 graButton btnReply" style="width:100px" type="button"><span class="text"><i class="xi-subdirectory-arrow xi-x"></i> 답글쓰기</span></button>
		<!-- DYNAMIC @is_reply@ -->
	</div>
	
	<!-- DYNAMIC @is_modify@ -->
	<div class="listBtnR">
		<button class="graident4 graButton btnModify" style="width:120px" type="button"><span class="text"><i class="xi-eraser-o xi-x"></i> 글수정</span></button>
		<button class="graident5 graButton btnDelete" style="width:120px" type="button"><span class="text"><i class="xi-trash-o xi-x"></i> 글삭제</span></button>
	</div>
	<!-- DYNAMIC @is_modify@ -->

	<div class="empty20"></div>	
	
	<!-- DYNAMIC @is_pn_article@ -->
	<div class="listPN">
		<!-- DYNAMIC @is_prev_article@ -->
		<div class="list">
			<span>이전글 <i class="xi-angle-up-thin xi-x"></i></span>
			<!-- DYNAMIC @is_pnotice@ -->
			<i class="xi-lightbulb-o xi-x" title="공지"></i>
			<!-- DYNAMIC @is_pnotice@ -->
			<!-- DYNAMIC @is_psecret@ -->
			<i class="xi-lock-o xi-x" title="비밀글"></i>
			<!-- DYNAMIC @is_psecret@ -->
			<!-- DYNAMIC @is_pdepth@ -->
			{{EMPTY}}<i class="xi-subdirectory-arrow xi-x"></i>
			<!-- DYNAMIC @is_pdepth@ -->
			<a href="{{DEFAULT_LINK}}&b_mode=view&uid={{p_uid}}" class="link">{{p_subject}}</a>
		</div>
		<!-- DYNAMIC @is_prev_article@ -->
		<!-- DYNAMIC @is_next_article@ -->
		<div class="list">
			<span>다음글 <i class="xi-angle-down-thin xi-x"></i></span>
			<!-- DYNAMIC @is_nnotice@ -->
			<i class="xi-lightbulb-o xi-x" title="공지"></i>
			<!-- DYNAMIC @is_nnotice@ -->
			<!-- DYNAMIC @is_nsecret@ -->
			<i class="xi-lock-o xi-x" title="비밀글"></i>
			<!-- DYNAMIC @is_nsecret@ -->
			<!-- DYNAMIC @is_ndepth@ -->
			{{EMPTY}}<i class="xi-subdirectory-arrow xi-x"></i>
			<!-- DYNAMIC @is_ndepth@ -->			
			<a href="{{DEFAULT_LINK}}&b_mode=view&uid={{n_uid}}" class="link">{{n_subject}}</a>
		</div>
		<!-- DYNAMIC @is_next_article@ -->
	</div>
	<div class="empty20"></div>
	<!-- DYNAMIC @is_pn_article@ -->
	
	<!-- DYNAMIC @is_empty@ -->
	<div class="empty80"></div>
	<!-- DYNAMIC @is_empty@ -->

</div>
