<link rel="stylesheet" href="../../lib/toastui-chart.min.css" />
<script src="../../lib/toastui-chart.min.js"></script>

<div class="content">
	<div class="listLine"></div>	
	<div class="listSelect size09">		
		<form name='modifyForm1' method="get" action='{{PHP_SELF}}' />
		<input type="hidden" name="mode" value="{{mode}}" />
		<!-- DYNAMIC @is_year1@ -->
		<div class="firstLine selectYear" style="padding-left:0">
			<select name="year">
				<!-- DYNAMIC @loop_year1@ -->
				<option value="{{i}}">{{i}}년</option>
				<!-- DYNAMIC @loop_year1@ -->
			</select>		
			<script>
				$("form[name=modifyForm1] select[name='year']").val('{{year}}').heapbox({'width' : '150px', 'onChange':function(value) { $("form[name=modifyForm1]").submit(); } });
			</script>
		</div>
		<!-- DYNAMIC @is_year1@ -->
		<!-- DYNAMIC @is_month1@ -->
		<div class="line selectMonth">
			<select name="month">
				<!-- DYNAMIC @loop_month1@ -->
				<option value="{{i2}}">{{i2}}월</option>
				<!-- DYNAMIC @loop_month1@ -->
			</select>		
			<script>
				$("form[name=modifyForm1] select[name='month']").val('{{month}}').heapbox({'width' : '150px', 'onChange':function(value) { $("form[name=modifyForm1]").submit(); } });
			</script>
		</div>
		<!-- DYNAMIC @is_month1@ -->
		<!-- DYNAMIC @is_week1@ -->
		<div class="line selectWeek">
			<select name="week">
				<!-- DYNAMIC @loop_week1@ -->
				<option value="{{DATES}}">{{cnt}}주 ( {{DATES}} )</option>
				<!-- DYNAMIC @loop_week1@ -->
			</select>		
			<script>
				$("form[name=modifyForm1] select[name='week']").val('{{week}}').heapbox({'width' : '250px', 'onChange':function(value) { $("form[name=modifyForm1]").submit(); } });
			</script>
		</div>
		<!-- DYNAMIC @is_week1@ -->
		<!-- DYNAMIC @is_day1@ -->
		<div class="line  selectDay">
			<select name="day">
				<!-- DYNAMIC @loop_day1@ -->
				<option value="{{i2}}">{{i2}}일</option>
				<!-- DYNAMIC @loop_day1@ -->
			</select>		
			<script>
				$("form[name=modifyForm1] select[name='day']").val('{{day}}').heapbox({'width' : '150px', 'heapsize' : '335px', 'searchUsed' : false, 'onChange':function(value) { $("form[name=modifyForm1]").submit(); } });
			</script>
		</div>
		<!-- DYNAMIC @is_day1@ -->	
		<!-- DYNAMIC @is_detail1@ -->
		<div class="firstLine selectDetail" style="padding-left:0; font-size:1.05em">
			<div class="requireLeft" style="padding-left:0;"><input type="text" name="s_date" class="ip2 dates" value="{{s_date}}" data-date-picker='1' /></div>
			<div class="floatLeft" style="padding:0 0 0 15px;">~</div>
			<div class="requireLeft"><input type="text" name="e_date" class="ip2 dates" value="{{e_date}}" data-date-picker='1' /></div>
			<div class="floatLeft" style="padding-left:5px;">
				<button class="graButtonWhite btnSubmit floatLeft" type="button" style=" width:74px"><span class="text"><i class="xi-search xi-x"></i> 검색</span></button>
				<button class="btns2" type="button" data-s_date='{{DATE1}}' data-e_date='{{DATE1}}'>오늘</button>
				<button class="btns2" type="button" data-s_date='{{DATE2}}' data-e_date='{{DATE1}}'>3일</button>
				<button class="btns2" type="button" data-s_date='{{DATE3}}' data-e_date='{{DATE1}}'>7일</button>
				<button class="btns2" type="button" data-s_date='{{DATE4}}' data-e_date='{{DATE1}}'>1개월</button>
				
			</div>
		</div>
		<!-- DYNAMIC @is_detail1@ -->
		</form>
	</div>
	<div class="listSelectR">
		<div class="contentMenu">		
			<ul>			
				<li class="contentMenuSub {{select_year}}" data-mode="year">년간통계</li>
				<li class="contentMenuSub {{select_month}}" data-mode="month">월간통계</li>
				<li class="contentMenuSub {{select_week}}" data-mode="week">주간통계</li>				
				<li class="contentMenuSub {{select_day}}" data-mode="day">일간통계</li>	
				<li class="contentMenuSub {{select_detail}}" data-mode="detail">특정기간통계</li>
			</ul>
			<div class="contentBar left"></div>
			<div class="contentBar right"></div>

			<script>
				var a = 100 / parseInt($(".content .listSelectR .contentMenu ul li").length);
				$(".content .listSelectR .contentMenuSub").css({'width':'calc('+a+'% - 2px)'});
			</script>
		</div>		
	</div>	

	<div id="listArea">
		<div class="empty10">&nbsp;</div>	
		<div id="chart-area"></div>
		<div class="empty10">&nbsp;</div>

		<table class="listIn fixed-header">
		<colgroup>		
		<col width="8%" />		<!-- 순위 --> 
		<col width="30%" />		<!-- {{TTL}} --> 
		<col width="10%" />		<!-- 방문자수 --> 
		<col width="52%" />		<!-- 점유률 --> 
		</colgroup>
		<thead> 
		<tr> 
			<th>순위</th>
			<th>{{TTL}}</th>
			<th>횟수</th>
			<th>점유률</th>
		</tr>
		</thead>
		<tbody>
		<!-- DYNAMIC @loop_list@ -->
		<tr>
			<td>{{NUM}}</td>
			<td style="text-align:left;">{{CONTENT}}</td>
			<td>{{COUNT}}</td>
			<td>
				<div class="per_line"><div class="per_line_bar" data-per="{{WIDTH}}">&nbsp;</div></div>
				<div class="floatRight size09">{{PER}}%</div>
			</td>
		</tr>
		<!-- DYNAMIC @loop_list@ -->
		<!-- DYNAMIC @empty_list@ -->
		<tr>
			<td colspan="4" class="emptyList"><i class="fas fa-quote-left"></i>&nbsp;&nbsp;등록된 내역이 없습니다!&nbsp;&nbsp;<i class="fas fa-quote-right"></i></td>
		<tr>
		<!-- DYNAMIC @empty_list@ -->
		</tbody>
		</table>
	</div>

	<div class="listSelectB size09">		
		<form name='modifyForm2' method="get" action='{{PHP_SELF}}' />
		<input type="hidden" name="type" value="{{type}}" />
		<input type="hidden" name="mode" value="{{mode}}" />
		<!-- DYNAMIC @is_year2@ -->
		<div class="firstLine selectYear" style="padding-left:0">
			<select name="year">
				<!-- DYNAMIC @loop_year2@ -->
				<option value="{{i}}">{{i}}년</option>
				<!-- DYNAMIC @loop_year2@ -->
			</select>		
			<script>
				$("form[name=modifyForm2] select[name='year']").val('{{year}}').heapbox({'width' : '150px', 'onChange':function(value) { $("form[name=modifyForm2]").submit(); } });
			</script>
		</div>
		<!-- DYNAMIC @is_year2@ -->
		<!-- DYNAMIC @is_month2@ -->
		<div class="line selectMonth">
			<select name="month">
				<!-- DYNAMIC @loop_month2@ -->
				<option value="{{i2}}">{{i2}}월</option>
				<!-- DYNAMIC @loop_month2@ -->
			</select>		
			<script>
				$("form[name=modifyForm2] select[name='month']").val('{{month}}').heapbox({'width' : '150px', 'onChange':function(value) { $("form[name=modifyForm2]").submit(); } });
			</script>
		</div>
		<!-- DYNAMIC @is_month2@ -->
		<!-- DYNAMIC @is_week2@ -->
		<div class="line selectWeek">
			<select name="week">
				<!-- DYNAMIC @loop_week2@ -->
				<option value="{{DATES}}">{{cnt}}주 ( {{DATES}} )</option>
				<!-- DYNAMIC @loop_week2@ -->
			</select>		
			<script>
				$("form[name=modifyForm2] select[name='week']").val('{{week}}').heapbox({'width' : '250px', 'onChange':function(value) { $("form[name=modifyForm2]").submit(); } });
			</script>
		</div>
		<!-- DYNAMIC @is_week2@ -->
		<!-- DYNAMIC @is_day2@ -->
		<div class="line  selectDay">
			<select name="day">
				<!-- DYNAMIC @loop_day2@ -->
				<option value="{{i2}}">{{i2}}일</option>
				<!-- DYNAMIC @loop_day2@ -->
			</select>		
			<script>
				$("form[name=modifyForm2] select[name='day']").val('{{day}}').heapbox({'width' : '150px', 'heapsize' : '335px', 'searchUsed' : false, 'onChange':function(value) { $("form[name=modifyForm2]").submit(); } });
			</script>
		</div>
		<!-- DYNAMIC @is_day2@ -->
		<!-- DYNAMIC @is_detail2@ -->
		<div class="firstLine selectDetail" style="padding-left:0; font-size:1.05em">
			<div class="requireLeft" style="padding-left:0;"><input type="text" name="s_date" class="ip2 dates" datePicker='1' value="{{s_date}}" /></div>
			<div class="floatLeft" style="padding:0 0 0 15px;">~</div>
			<div class="requireLeft"><input type="text" name="e_date" class="ip2 dates" datePicker='1' value="{{e_date}}" /></div>
			<div class="floatLeft" style="padding-left:5px;">
				<button class="graButtonWhite btnSubmit floatLeft" type="button" style=" width:74px"><span class="text"><i class="xi-search xi-x"></i> 검색</span></button>
				<button class="btns2" type="button" data-s_date='{{DATE1}}' data-e_date='{{DATE1}}'>오늘</button>
				<button class="btns2" type="button" data-s_date='{{DATE2}}' data-e_date='{{DATE1}}'>3일</button>
				<button class="btns2" type="button" data-s_date='{{DATE3}}' data-e_date='{{DATE1}}'>7일</button>
				<button class="btns2" type="button" data-s_date='{{DATE4}}' data-e_date='{{DATE1}}'>1개월</button>
				
			</div>
		</div>
		<!-- DYNAMIC @is_detail2@ -->
		</form>
	</div>
	<div class="listSelectRB"></div>
	<div class="listLineB"></div>
</div>
