<div class="content">
	
	<form name='searchForm' method='get' action='{{PHP_SELF}}'>
	<div class="searchBox">
		<div class="floatLeft">
			<select name="field">
				<option value="name">쿠폰명</option>
				<option value="goods_order">상품UID</option>
			</select>			
		</div>
		<div class="searchBoxIn">
			<input type="text" name="keyword" value="{{keyword}}" data-search-btn="1" data-on-enter="1" />
			<p class="resetIcon resetIconBtn"><i class="xi-undo masterTooltip" title="초기화"></i></p>
		</div>		
	</div>
	</form>

	<script>
	<!--	
		$("form[name=searchForm] select[name='field']").val('{{field}}').heapbox({'width' : '200px'});
	//-->
	</script>

	<div class="empty60"></div>
	
	<div class="listTop">
		<form name='listSearchForm' method='get' action='{{PHP_SELF}}?{{searchstring}}' />
		<div class="listLeft size14">
			전체 : <b class="orange">{{ATOTAL}}</b>건 
			<!-- DYNAMIC @is_search@ -->
			, 검색 : <b class="orange">{{TOTAL}}</b>건
			<!-- DYNAMIC @is_search@ -->
		</div>
		<div class="listRight size10">
			<div class="floatLeft">
				<select name="sort">
					<option value="uid DESC">등록일 역순</option>
					<option value="uid ASC">등록일 순</option>					
				</select>
				&nbsp;&nbsp;
			</div>
			<div class="floatLeft">				
				<select name="limit">
					<option value="10">10개 보기</option>
					<option value="20">20개 보기</option>
					<option value="30">30개 보기</option>
					<option value="40">40개 보기</option>
					<option value="50">50개 보기</option>
					<option value="60">60개 보기</option>
					<option value="70">70개 보기</option>
					<option value="80">80개 보기</option>
					<option value="90">90개 보기</option>
					<option value="100">100개 보기</option>
				</select>
			</div>
		</div>
		</form>
	</div>

	<div class="empty10"></div>
	<div class="listLine"></div>
	<div class="listSelect">
		<div class="floatLeft">
			<button class="graButtonWhite secDelete" type="button"><span class="text"><i class="xi-file-check-o xi-x"></i> 선택삭제</span></button>
		</div>
	</div>
	<div class="listSelectR">
		<button class="graident1 graButton btnWrite" type="button"><i class="fas fa-link"></i> 쿠폰등록</button>
	</div>
	
	<div id="listArea">
		<!-- DYNAMIC @is_list_area@ -->
		<form name="listForm" method="post" action='coupon_post.php?{{addstring}}' target='HFrm'>
		<input type="hidden" name="mode" />
		<table class="listIn fixed-header">
		<colgroup>
		<col width="5%" /> 
		<col width="5%" /> 
		<col width="21%" /> 
		<col width="15%" /> 
		<col width="15%" /> 
		<col width="18%" />
		<col width="8%" />
		<col width="8%" />
		<col width="10%" />
		<col width="5%" />
		</colgroup>
		<thead> 
		<tr> 
			<th><label><input type='checkbox' name="check_all" id="check_all" value="1" /><span></span></label></th>
			<th>번호</th>			
			<th>쿠폰명 <i class="xi-link"></i></th>
			<th>발급방식</th>
			<th>혜택내용</th>
			<th>사용기간</th>
			<th>적용상품</th>
			<th>발급수량 <i class="xi-link"></i></th>
			<th>등록일</th>
			<th>처리</th>
		</tr>
		</thead>
		<tbody>
		<!-- DYNAMIC @loop_list@ -->		
		<tr>
			<td><label><input type='checkbox' name="item[]" value="{{UID}}" class="ckeckItem" /><span></span></label></td>
			<td class="number">{{NUM}}</td>
			<td style="text-align:left"><a href="coupon_info.php?mode=modify&uid={{UID}}{{addstring}}" class="underLine">{{NAME}}</a></td>
			<td>{{TYPE}}</td>			
			<td>{{DISCOUNT}}</td>
			<td>{{USE_TYPE}}</td>
			<td class="number">{{GOODS_ORDER}}</td>
			<td class="number"><a href="coupon_down_list.php?c_uid={{UID}}" title="발급쿠폰리스트 보기">{{COUPON}}건</a></td>
			<td class="number">{{SIGNDATE}}</td>	
			<td><i class="fas fa-edit masterTooltip" title="수정하기" onclick="window.location.href='coupon_info.php?mode=modify&uid={{UID}}{{addstring}}'"></i></td>	
		</tr>
		<!-- DYNAMIC @loop_list@ -->
		<!-- DYNAMIC @empty_list@ -->
		<tr>
			<td colspan="10" class="emptyList"><i class="fas fa-quote-left"></i>&nbsp;&nbsp;등록(검색)된 쿠폰내역이 없습니다!&nbsp;&nbsp;<i class="fas fa-quote-right"></i></td>
		<tr>
		<!-- DYNAMIC @empty_list@ -->
		</tbody>
		</table>
		</form>
		<!-- DYNAMIC @is_list_area@ -->
	</div>

	<div class="listSelectB"></div>
	<div class="listSelectRB"></div>
	<div class="listLineB"></div>

	<div class="paging">{{PAGING}}</div>

</div>
