<form name='couponForm' method='post' action='coupon_post.php?{{addstring}}' target='HFrm'>
<input type="hidden" name="mode" value="{{mode}}" />
<input type="hidden" name="uid" value="{{uid}}" />
<input type="hidden" name="goods_order" />
<input type='hidden' name='use_limit2' value='0' />

<div class="content">

	<div class="contentTitle">
		<i class="xi-file-text xi-x"></i>&nbsp;&nbsp;쿠폰 기본정보
	</div>

	<table>
	<colgroup>
	<col width="16%" /> 
	<col width="34%" />
	<col width="16%" /> 
	<col width="34%" />	
	</colgroup>
	<tr> 
		<td>쿠폰명</td>
		<td colspan="3"><p style="position:relative"><input type='text' value='{{name}}' style="width:98%" required="required" data-msg="쿠폰명을" data-toname="name" /></p></td>
	</tr>	
	<tr> 
		<td>발급방식 <i class="xi-help xi-x colorDGary masterTooltip" title="- 관리자 수동발급은 쿠폰생성후 회원관리에서 선택하여 발급하시면 됩니다.[BR]- 첫주문시 자동발급은 첫주문후 자동으로 쿠폰이 발급되며 다음 주문에 사용 할 수 있습니다.[BR] - 생일쿠폰 자동발급은 생일날 자동발급 됩니다.[BR]- 상품상세페이지 다운로드로 발금된 쿠폰은 중복사용이 가능 합니다."></i></td>
		<td colspan="3">
			<label><input type='radio' name="type" value="0" {{checked_type_0}} /><span class="radio"></span> 관리자 수동발급</label>&nbsp;&nbsp;
			<label><input type='radio' name="type" value="1" {{checked_type_1}} /><span class="radio"></span> 회원가입시 자동발급</label>&nbsp;&nbsp;
			<label><input type='radio' name="type" value="2" {{checked_type_2}} /><span class="radio"></span> 첫주문시 자동발급</label>&nbsp;&nbsp;
			<label><input type='radio' name="type" value="3" {{checked_type_3}} /><span class="radio"></span> 생일쿠폰 자동발급</label>&nbsp;&nbsp;
			<label><input type='radio' name="type" value="4" {{checked_type_4}} /><span class="radio"></span> 상품상세페이지 다운로드</label>&nbsp;&nbsp;			
		</td>
	</tr>
	<tr> 
		<td>혜택내용</td>
		<td colspan="3" style="line-height:2.2em">
			<div class="floatLeft">총 상품금액에서 </div>

			<div class="requireLeft" style="line-height:1.4em">
				<input type='text' name='discount' value='{{discount}}' style="width:100px; font-size:14px" class="only_num_format" required="required" data-msg="금액을" />
			</div>
			<div class="requireLeft">				
				<select name="discount_type">
					<option value="P">%</option>
					<option value="W">원</option>
				</select>	
				<script>
					$("form[name=couponForm] select[name='discount_type']").val('{{discount_type}}').heapbox({'width' : '100px', 'onChange':function(value){ ckDiscountType(value); } });
				</script>
			</div>
			<div class="requireLeft discount_limit">최대 <input type='text' name='discount_limit' value='{{discount_limit}}' style="width:100px; font-size:14px" class="only_num_format" />	원</div>
			<div class="floatLeft">&nbsp;을(를) 할인 합니다.</div>
			<div class="floatLeft discount_limit"> (0원일 경우 제한없음)</div>
		</td>
	</tr>
	<tr> 
		<td>사용기간 <i class="xi-help xi-x colorDGary masterTooltip" title="사용기간은 시작일 00:00:00 ~ 종료일 23:59:59 까지 적용 됩니다."></i></td>
		<td colspan="3" style="line-height:2.2em">
			<label>
				<div class="floatLeft"><input type='radio' name="use_type" value="0" {{checked_use_type_0}} /><span class="radio"></span></div>
				<div class="requireLeft" style="line-height:1.4em"><input type="text" name="use_s_date" value="{{use_s_date}}" class="ip3 dates" placeholder="시작일" data-msg="시작일을" data-date-picker='2'  /></div>
				<div class="floatLeft" style="padding:0 0 0 15px;">일 부터</div>
				<div class="requireLeft" style="line-height:1.4em"><input type="text" name="use_e_date" value="{{use_e_date}}" class="ip3 dates" placeholder="종료일" data-msg="종료일을" data-date-picker='2' /></div>
				<div class="floatLeft" style="padding-left:15px;">일 까지 사용가능 합니다.</div>
			</label>
			<div class="empty10"></div>			
			<label>
				<div class="floatLeft"><input type='radio' name="use_type" value="1" {{checked_use_type_1}} /><span class="radio"></span></div>
				<div class="requireLeft">발급 후 <input type='text' name='use_day' value='{{use_day}}' style="width:100px; font-size:14px" class="only_num_format" />일간 사용 가능 합니다. (0일일 경우 제한없음)
			</label>
			
		</td>
	</tr>
	<tr class="use_limit"> 
		<td>사용가능 기준금액</td>
		<td colspan="3">
			총 상품금액이 <input type='text' name='use_limit' value='{{use_limit}}' style="width:100px; font-size:14px" class="only_num_format" />원 이상일 경우 사용 가능 합니다. (0원일 경우 제한없음)
		</td>
	</tr>
	<!--
	<tr class="goods"> 
		<td>중복사용 설정</td>
		<td colspan="3">
			한 상품당 <input type='text' name='use_limit2' value='{{use_limit2}}' style="width:100px; font-size:14px" class="only_num_format" />회까지 사용이 가능 합니다. (0회일 경우 제한없음)
		</td>
	</tr>
	-->
	<tr class="goods"> 
		<td>상품선택</td>
		<td colspan="3">			
			<div>
				<div id="relatedGoods" style="display:block">
					<div class="floatRight">
						<button class="btns" style="float:right" type="button" id="addGoods">
							<span class="text"><i class="xi-focus-frame"></i> 상품추가하기</span>
						</button>
					</div>

					<div class="empty20 clearboth"></div>
					<ul id="relatedGoodsSortable"></ul>
					<div id="relatedGoodsEmpty">상품추가하기를 이용하여 쿠폰을 적용할 상품을 등록 해 주시면 됩니다.</div>
				</div>
			</div>
		</td>
	</tr>
	</table>
	
	<div class="empty60" ></div>

	<div class="btnSubmitBox">
		<div class="displayInline"><button class="weight300 shine" type="submit">쿠폰 {{TTL}}하기</button></div>
		<div class="btnPrev"><i class="xi-arrow-left xi-x"></i></div>
		<div class="btnPrevTitle">이전페이지</div>		
	</div>

</div>

</form>

<script>
<!--
	
	function ckType() {		
		if($('form[name=couponForm] input[name=type]:checked').val()=='4') {
			$(".use_limit").hide();
			$(".goods").show();
		}
		else {
			$(".use_limit").show();
			$(".goods").hide();
		}
		resetContent();
	}

	function ckDiscountType(value) {
		if(value == 'P')	$(".discount_limit").show();
		else				$(".discount_limit").hide();	
	}

	function ckUseType() {
		var nameArr = new Array('use_s_date','use_e_date');

		if($('form[name=couponForm] input[name=use_type]:checked').val()=='0') {
			for(i=0;i<nameArr.length;i++) {
				dipslayDarkShow('form[name=couponForm] input[name='+nameArr[i]+']');
			}
			dipslayDarkHide('form[name=couponForm] input[name=use_day]');

			resetTooltip();
		}
		else {
			for(i=0;i<nameArr.length;i++) {
				dipslayDarkHide('form[name=couponForm] input[name='+nameArr[i]+']');
			}
			dipslayDarkShow('form[name=couponForm] input[name=use_day]');
		}
	}

	function relatedGoodsGet(uid) {

		alertify.closeAll('iframeDialog');

		var ck_value	= $('form[name=couponForm] input[name=goods_order]').val().split(',');
		if(typeof(uid)=='string') var ck_uid = uid.split(',');
		else var ck_uid = uid;
		
		var uid = [];
		for(i=0, cnt=ck_uid.length; i<cnt; i++) {			
			if(ck_value.indexOf(ck_uid[i])==-1) uid.push(ck_uid[i]);
		}
		
		if(uid.length == 0) {
			alertify.alert("이미 등록된 상품 입니다.");
			return;		
		}

		var data = new FormData();

		data.append('uid',uid);

		$.ajax({
			url: '../goods/goods_info_json.php', 
			type: 'POST',	
			data: data, 
			cache: false,
			dataType: 'json',
			processData: false, 
			contentType: false, 
			success: function(data, textStatus, jqXHR) {
				if(typeof(data.error) === 'undefined') {											
					$.each(data, function(key, value) {
						relatedGoodsInsert(data[key].uid, data[key].image, data[key].name, data[key].price);					
					});				
				}
				else {
					alertify.error(data.error);
				}
			},
			error: function(jqXHR, textStatus, errorThrown) {
				alertify.error(textStatus);
			}		
		});
	}

	function relatedGoodsInsert(uid, img, name, price) {
		if(!uid) return;

		var insertCode = '<li data-idx="'+uid+'">';
		insertCode += '		<div class="relatedGoods">';
		insertCode += '			<a href="{{SMain}}?channel=view&uid=' + uid + '" target="_blank"><img src="'+img+'" alt="'+name+'" /></a>';
		insertCode += '			<span id="relatedGoodsIcon_'+uid+'"><i class="xi-close masterTooltip" title="해제하기"></i></span>';
		insertCode += '			<p>['+price+'] '+name+'</p>';
		insertCode += '		</div>';
		insertCode += '	  </li>';

		$('#relatedGoodsSortable').append(insertCode);
		
		$('#relatedGoodsIcon_'+uid).find('.xi-close').click(function(e){
			relatedGoodsDelete($(this).parent('span').parent('div').parent('li'));
		});

		resetTooltip();
		resetContent();

		$('#relatedGoodsSortable').sortable({
			placeholder: "highlight",
			cursor : "move",
			update : function(e, ui) {
				$('form[name=couponForm] input[name=goods_order]').val($(this).sortable("toArray", { attribute : 'data-idx' }));
			}
		});
		
		$('form[name=couponForm] input[name=goods_order]').val($('#relatedGoodsSortable').sortable("toArray", { attribute : 'data-idx' }));
		
		$("#relatedGoodsSortable").disableSelection();

		$("#relatedGoodsEmpty").hide();
	}

	function relatedGoodsDelete($t) {
		$t.remove();	
		$('form[name=couponForm] input[name=goods_order]').val($('#relatedGoodsSortable').sortable("toArray", { attribute : 'data-idx' }));
		if(!$('form[name=couponForm] input[name=goods_order]').val()) $("#relatedGoodsEmpty").show();
		resetContent();
	}

	$(function() {
		
		$('#addGoods').click(function(e){
			iframeView("../goods/popup_goods_search.php?type=relatedGoods", "상품검색");
		});	

		$('form[name=couponForm] input[name=type]').click(function(e){
			ckType();
		});	

		$('form[name=couponForm] input[name=use_type]').click(function(e){
			ckUseType();
		});	

		<!-- DYNAMIC @is_goods_order@ -->
		relatedGoodsGet('{{goods_order}}');
		<!-- DYNAMIC @is_goods_order@ -->
		
		ckType();
		ckUseType();
				
	});	

//-->
</script>
