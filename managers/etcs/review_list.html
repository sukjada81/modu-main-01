<div class="content">
	
	<form name='searchForm' method='get' action='{{PHP_SELF}}'>
	<div class="searchBox">
		<div class="floatLeft">
			<select name="field">
				<option value="multi">통합</option>
				<option value="g_name">상품명</option>
				<option value="name">이름</option>
				<option value="id">아이디</option>
			</select>			
		</div>
		<div class="searchBoxIn">
			<input type="text" name="keyword" value="{{keyword}}" data-search-btn="1" data-on-enter="1" />
			<p class="resetIcon resetIconBtn"><i class="xi-undo masterTooltip" title="초기화"></i></p>
		</div>

		<div class="expensionArrow">
			<div class="box"></div>
			<i class="xi-arrow-down box_down"></i>			
		</div>
	</div>
	<div class="searchDetail">
		<div class="searchDetailBox">
			<table class="search">
			<colgroup>
			<col width="33%" /> 
			<col width="33%" />
			<col width="33%" /> 
			</colgroup>
			<tr> 
				<td>
					<select name="stars">
						<option value="">별점</option>
						<option value="1">1점</option>
						<option value="2">2점</option>
						<option value="3">3점</option>
						<option value="4">4점</option>
						<option value="5">5점</option>
					</select>							
				</td>
				<td>
					<select name="best">
						<option value="">베스트</option>
						<option value="0">일반</option>
						<option value="1">베스트</option>
					</select>						
				</td>			
				<td>
					<select name="vendor" style="display:none;">
						<option value="">판매사</option>
						<!-- DYNAMIC @loop_vendor@ -->
						<option value='{{vendor_id}}'>{{vendor_name}} ({{vendor_id}})</option>
						<!-- DYNAMIC @loop_vendor@ -->
					</select>						
				</td>		
			</tr>			
			</table>					
		</div>	
		<div class="btnSearchSubmitBox">
			<div class="btnCircleSearch"><div class="btnCircleSearchTitle">검색</div><i class="xi-search xi-x"></i></div>
			<div class="btnCircleReset"><div class="btnCircleResetTitle">초기화</div><i class="xi-undo xi-x"></i></div>						
		</div>
	</div>
	</form>

	<script>
	<!--	
		$("form[name=searchForm] select[name='field']").val('{{field}}').heapbox({'width' : '200px'});
		$("form[name=searchForm] select[name='stars']").val('{{stars}}').heapbox({'width' : '99%'});
		$("form[name=searchForm] select[name='best']").val('{{best}}').heapbox({'width' : '99%'});
		$("form[name=searchForm] select[name='vendor']").val('{{vendor}}').show().heapbox({'width' : '99%', 'heapsize' : '400px'});
		
		$('.searchDetail').hide();
	//-->
	</script>

	<div class="empty60"></div>
	
	<div class="listTop">
		<form name='listSearchForm' method='get' action='{{PHP_SELF}}?{{searchstring}}' />
		<div class="listLeft size14">
			전체 : <b class="orange">{{ATOTAL}}</b>건 
			<!-- DYNAMIC @is_search@ -->
			, 검색 : <b class="orange">{{TOTAL}}</b>건
			<!-- DYNAMIC @is_search@ -->
		</div>
		<div class="listRight size10">
			<div class="floatLeft">
				<select name="sort">
					<option value="uid DESC">등록일 역순</option>
					<option value="uid ASC">등록일 순</option>					
				</select>
				&nbsp;&nbsp;
			</div>
			<div class="floatLeft">				
				<select name="limit">
					<option value="10">10개 보기</option>
					<option value="20">20개 보기</option>
					<option value="30">30개 보기</option>
					<option value="40">40개 보기</option>
					<option value="50">50개 보기</option>
					<option value="60">60개 보기</option>
					<option value="70">70개 보기</option>
					<option value="80">80개 보기</option>
					<option value="90">90개 보기</option>
					<option value="100">100개 보기</option>
				</select>
			</div>
		</div>
		</form>
	</div>

	<div class="empty10"></div>
	<div class="listLine"></div>
	<div class="listSelect">
		<button class="graButtonWhite secDelete" type="button"><span class="text"><i class="xi-file-check-o xi-x"></i> 선택삭제</span></button>
	</div>

	<div id="listArea">
		<!-- DYNAMIC @is_list_area@ -->
		<form name="listForm" method="post" action='review_post.php?{{addstring}}' target='HFrm'>
		<input type="hidden" name="mode" />
		<table class="listIn fixed-header">
		<colgroup>
		<col width="4%" /> 
		<col width="5%" /> 
		<col width="14%" /> 
		<col width="28%" /> 
		<col width="14%" />
		<col width="13%" />
		<col width="6%" />
		<col width="10%" />
		<col width="5%" />
		</colgroup>
		<thead> 
		<tr> 
			<th><label><input type='checkbox' name="check_all" id="check_all" value="1" /><span></span></label></th>
			<th>번호</th>
			<th>판매사 <i class="xi-focus-frame"></i></th>
			<th>상품명 <i class="xi-external-link"></i></th>
			<th>등록인 <i class="xi-focus-frame"></i></th>
			<th>별점</th>
			<th>베스트</th>
			<th>등록일</th>	
			<th>보기</th>
		</tr>
		</thead>
		<tbody>
		<!-- DYNAMIC @loop_list@ -->		
		<tr>
			<td><label><input type='checkbox' name="item[]" value="{{UID}}" class="ckeckItem" /><span></span></label></td>
			<td class="number">{{NUM}}</td>
			<td>
				<div class='btnVCrm cursorPoint center' data-id='{{VENDOR_ID}}'>
					<div class="empty5"></div>
					<div class='barId'>{{VENDOR_ID}}</div>
					<div class="empty5"></div>
					<div class='barName2'>{{VENDOR}}</div>
				</div>				
			</td>
			<td style="text-align:left"><a href="{{SMain}}?channel=view&uid={{G_UID}}" title="사용자페이지상품보기" target="_blank">{{G_NAME}}</a></td>
			<td>
				{{NAME}}
				<!-- DYNAMIC @is_member@ -->
				<center>
				<div class='btnCrm cursorPoint' data-id='{{MEMBER_ID}}'>
					<div class="empty5"></div>
					<div class='barId'>{{MEMBER_ID}}</div>
					<div class="empty5"></div>
					<div class='barName2'>{{MEMBER_LEVEL}}</div>
				</div>
				</center>
				<!-- DYNAMIC @is_member@ -->
			</td>	
			<td>
				<!-- DYNAMIC @loop_stars@ -->
				<i class="xi-star xi-x"></i>
				<!-- DYNAMIC @loop_stars@ -->	
			</td>
			<td>{{BEST}}</td>
			<td class="number">{{SIGNDATE}}</td>
			<td><i class="xi-eye-o xi-x masterTooltip" title="상세보기" onclick="window.location.href='review_info.php?uid={{UID}}{{addstring}}'"></i></td>
		</tr>
		<!-- DYNAMIC @loop_list@ -->
		<!-- DYNAMIC @empty_list@ -->
		<tr>
			<td colspan="9" class="emptyList"><i class="fas fa-quote-left"></i>&nbsp;&nbsp;등록(검색)된 구매후기가 없습니다!&nbsp;&nbsp;<i class="fas fa-quote-right"></i></td>
		<tr>
		<!-- DYNAMIC @empty_list@ -->
		</tbody>
		</table>
		</form>
		<!-- DYNAMIC @is_list_area@ -->
	</div>

	<div class="listSelectB"></div>
	<div class="listSelectRB"></div>
	<div class="listLineB"></div>

	<div class="paging">{{PAGING}}</div>

</div>

<script src="../../lib/jquery.timeliny.js?ver={{ver}}"></script>
