<link href="../../lib/summernote-lite.css?ver={{ver}}" rel="stylesheet">
<script src="../../lib/summernote-lite.js?ver={{ver}}"></script>
<script src="../../lib/summernote-ko-KR.js"></script>

<form name='goodsForm' method='post' action='exhibition_post.php?{{addstring}}' enctype="multipart/form-data" target='HFrm'>
<input type="hidden" name="mode" value="{{mode}}" />
<input type="hidden" name="uid" value="{{uid}}" />
<input type="hidden" name="temp_upload" value="{{temp_upload}}" />
<input type="hidden" name="cate_order" />
<input type="hidden" name="cate_max_num" />
<input type="hidden" name="image1_del" />
<input type="hidden" name="detail_image_order" />

<div class="content">

	<div class="contentTitle">
		<i class="xi-file-text xi-x"></i>&nbsp;&nbsp;모음전 {{TTL}}
	</div>

	<table>
	<colgroup>
	<col width="16%" /> 
	<col width="34%" />
	<col width="16%" /> 
	<col width="34%" />	
	</colgroup>
	<tr> 
		<td>모음전명</td>
		<td colspan="3"><p style="position:relative"><input type='text' value='{{name}}' style="width:98%" required="required" data-msg="모음전명을" data-toname="name" /></p></td>
	</tr>
	<tr> 
		<td>할인여부</td>
		<td colspan="3">
			<div>
				<label><input type='radio' name="discount_yn" value="Y" {{checked_discount_yn_Y}} /><span class="radio"></span> 사용함</label>&nbsp;&nbsp;
				<label><input type='radio' name="discount_yn" value="N" {{checked_discount_yn_N}} /><span class="radio"></span> 사용안함</label>
			</div>
		</td>
	</tr>
	<tr> 
		<td>모음전 분류 <i class="xi-help xi-x colorDGary masterTooltip" title="- 모음전에서 분류를 생성하면 분류별로 상품을 보여 줄 수 있습니다.[BR]- 모음전 상품설정 후 분류를 삭제하면 해당 분류의 상품도 모음전에서 해제 됩니다."></i> <i class="xi-arrows xi-x colorDGary masterTooltip" title="등록된 항목을 마우스로 누르고 아래 위로 이동하시면 순서를 변경 하실 수 있습니다."></i></td>
		<td colspan="3" style="padding:20px;">
			<table class="listIn" id="cateSortable">
			<colgroup>
			<col width="10%" /> 
			<col width="10%" />
			<col width="70%" /> 			
			<col width="10%" />
			</colgroup>
			<thead>
			<tr> 
				<th>번호</th>
				<th>분류번호</th>
				<th>분류명</th>
				<th>처리</th>
			</tr>
			</thead>
			<tbody></tbody>
			</table>
		</td>		
	</tr>
	<tr > 
		<td>할인률 <i class="xi-help xi-x colorDGary masterTooltip" title="회원등급설정 중 제공할인률이 있는 경우 추가로 할인 됩니다."></i></td>
		<td>
			<p style="position:relative"><input type='text' name='discount' value='{{discount}}' maxlength="3" style="width:100px; font-size:14px;" class="only_num" data-msg="할인률을" /> %</p>
		</td>
		<td>할인기간 <i class="xi-help xi-x colorDGary masterTooltip" title="할인기간은 시작일 00:00:00 ~ 종료일 23:59:59 까지 적용 됩니다."></i></td>
		<td>
			<div class="requireLeft"><input type="text" name="s_date" value="{{s_date}}" class="ip3 dates" placeholder="시작일" data-msg="시작일을" data-date-picker='2'  /></div>
			<div class="floatLeft" style="padding:0 0 0 15px;">~</div>
			<div class="requireLeft"><input type="text" name="e_date" value="{{e_date}}" class="ip3 dates" placeholder="종료일" data-msg="종료일을" data-date-picker='2' /></div>
			<div class="floatLeft" style="padding-left:15px;">
		</td>
	</tr>
	<tr> 
		<td>목록 이미지 <i class="xi-help xi-x colorDGary masterTooltip" title="목록이미지 미등록시 제목으로 대체 됩니다."></i></td>
		<td colspan="3">
			<div class="btnBox2 floatLeft" >
				<div id="btn_image" class="btnBoxIcon">
					<i class="fas fa-plus-circle fa-2x"></i>											
				</div>												
				<input type="file" name="image1" class="imageBtn" data-num="1" />
				<img id="image1" alt="목록이미지" src="../common/img/blank.gif" />
				<div id="btn2_image1" class="btnBoxIcon2" data-num="1">
					<i class="fas fa-edit masterTooltip btnImgEdit" title="변경하기"></i>
					<i class="xi-close masterTooltip btnImgDel" title="삭제하기"></i>
				</div>
			</div>
			<div class="floatLeft" style="padding:25px 0 0 20px;">
				<span class="size09">권장 이미지 사이즈 : {{oimage_size}}</span><br />
				<span class="size09">등록 이미지 사이즈 : <span id="imgSize1"></span></span>
			</div>
		</td>
	</tr>
	<tr> 
		<td>모음전 설명 <i class="xi-help xi-x colorDGary masterTooltip" title="- 모음전 설명은 모음전 상품 리스트 윗 부분에 노출이 됩니다.[BR]- 이미지로만 등록에 등록된 이미지는 설명직접 등록시에도 사용할 수 있습니다.[BR]- 쇼핑몰 가로사이즈는 {{SHOP_WIDTH}}입니다."></i> <i class="xi-arrows xi-x colorDGary masterTooltip" title="등록된 이미지를 마우스로 누르고 아래 위, 좌 우로 이동하시면 순서를 변경 하실 수 있습니다."></i></td>
		<td colspan="3" style="padding:20px;">
			<div class="contentMenuDetail">		
				<ul>
					<li class="contentMenuDetailSub selected" id="contentMenuDetailSub1">이미지로만 등록</li>
					<li class="contentMenuDetailSub" id="contentMenuDetailSub2">설명직접 등록</li>
				</ul>
				<div class="contentBarDetail left"></div>
				<div class="contentBarDetail right"></div>

				<input type="hidden" name="detail_image_only" value="{{detail_image_only}}" />

				<script>
					var a = 100 / parseInt($(".contentMenuDetail ul li").length);
					$(".contentMenuDetailSub").css({'width':'calc('+a+'% - 2px)'});
				
					$('.contentMenuDetailSub').hover(function(e){		
						var left = $(this).position().left;
						var right = parseInt(left + parseInt($(this).css('width'))) + 1; 

						$(".contentMenuDetail .left").css({left:left}).show();
						$(".contentMenuDetail .right").css({left:right}).show();						
					}, 
					function() {
						$(".contentMenuDetail .left").hide();
						$(".contentMenuDetail .right").hide();
					});			
					
					$('.contentMenuDetailSub').click(function(e){						
						if(!$(this).hasClass('selected')) {
							$('.contentMenuDetailSub').removeClass('selected');
							$(this).addClass('selected');
							if($(this).prop('id')=='contentMenuDetailSub1'){
								$('.detailEditer').slideUp("fast", function() { resetContent(); });
								$(".detailBtn").hide();
								$('.detailImageType').show();
								$("form[name=goodsForm] input[name='detail_image_only']").val('1');
							}
							else {
								$('.detailImageType').hide();
								$('.detailEditer').slideDown("slow", function() { resetContent(); });
								$(".detailBtn").show();
								$("form[name=goodsForm] input[name='detail_image_only']").val('0');
							}
						}							
					})
				</script>
			</div>
			
			<div class="detailImage">
				<div class="detailImageType">
					<select name="detail_image_type">
						<option value="1">이미지간 공백 있게 출력</option>
						<option value="2">이미지간 공백 없이 출력</option>					
					</select>			
					<script>
						$("form[name=goodsForm] select[name='detail_image_type']").val('{{detail_image_type}}').heapbox({'width' : '300px'});
					</script>
				</div>
				<div class="floatRight">
					<button class="fileinput-button btns" style="float:right" type="button">
						<span class="text"><i class="xi-upload"></i> 이미지 업로드</span>
						<input type="file" name="detail_image" id="detail_image" multiple />
					</button>
				</div>

				<div class="empty20"></div>
				<ul id="detailImageSortable">
					<div id="detailImageEmpty">
						이미지 업로드 버튼을 누르거나 윈도우 파일 탐색기에서 이미지를 마우스로 드래그하여 설명에 사용할 이미지를 등록 해 주시면 됩니다.
						<div class="empty20"></div>						
						<i class="xi-file-add-o xi-3x"></i>
					</div>
				</ul>				
			</div>

			<div class="detailEditer">
				<XMP class="sn_explains" style="display:none">{{explains}}</XMP>	
				<input type="hidden" name="explains" data-notefor=".sn_explains" value= "" />
			</div>
		</td>
	</tr>
	</table>
	
	<div class="empty60" ></div>

	<div class="btnSubmitBox">
		<div class="displayInline"><button class="weight300 shine" type="submit">모음전 {{TTL}}하기</button></div>
		<div class="btnPrev"><i class="xi-arrow-left xi-x"></i></div>
		<div class="btnPrevTitle">이전페이지</div>		
	</div>

</div>

</form>
