<script>
<!--

	var form = document.cateForm;

	{{tmps1}}
	{{tmps2}}

	function accessType(){
		if($("form[name=cateForm] input:radio[name=access_type]:checked").val()=='2') $("#memberLevel").show();
		else $("#memberLevel").hide();
	}
			
	function cateDefault(){		
		$("form[name=cateForm] input[name=mode]").val("write");
		$("form[name=cateForm] input[name=cate_name]").val("");
		if($("form[name=cateForm] input:radio[name=used]:input[value=1]").prop('disabled')) $("form[name=cateForm] input:radio[name=used]:input[value=0]").prop('checked', true);
		else $("form[name=cateForm] input:radio[name=used]:input[value=1]").prop('checked', true);
		$("form[name=cateForm] input:radio[name=access_type]:input[value=0]").prop('checked', true);	
		
		accessType();
		accessLevel();		

		for(i=1; i<4; i++) putImage(i);
	}

	function cateAdd(num, cate, cate_name){
		var insertCode		=  '<li class="cateItem'+num+'" id="'+cate+'" data-idx="'+cate+'">'+cate_name+'</li>';
		$('#cateSortable'+num).append(insertCode);
		cateDefault();
		cateClickSet(num);
	}

	function cateMod(cate, cate_sub, cate_name) {
		if(cate_sub==1) {
			cate_name += '→';			
		}
		else {
			cate_name = str_replace("→","",cate_name);			
		}
		$('#'+cate).html(cate_name);
	}

	function cateMod2(cate, cate_sub) {
		if(cate_sub==1) {
			cate_name = $('#'+cate).html()+'→';			
		}
		else {
			cate_name = str_replace("→","",$('#'+cate).html());			
		}
		$('#'+cate).html(cate_name);
	}

	function cateDel(cate, cate_parent) {
		$('#'+cate).remove();				
		if($("form[name=cateForm] input[name=cate_dep]").val() > 1) {
			$('#'+cate_parent).mousedown();
		}
		else $('#cateRelease').click();
	}

	function accessLevel(vls) {
		$("form[name=cateForm] input:checkbox[name='access_level[]']").prop('checked', false);
		
		if(vls){
			$("form[name=cateForm] input:checkbox[name='access_level[]']").each(function(i) {
				if(vls.indexOf(',' + $(this).val() + ',') != -1) {
					$(this).prop('checked', true);
				}				
			});			
		}		
		$("form[name=cateForm] input:checkbox[name='access_level[]']").checkboxradio( "refresh" );
	}

	function putImage(num, vls, size) {
		if(vls) {
			$("#image"+num).attr("src", "../../image/category/"+vls);
			if(parseInt($("#imgWidth").css('width')) < parseInt(size)) {
				$("#image"+num).css({'width':'95%'});
			}
			else $("#image"+num).css({'width':size});

			$("#imageDel"+num).css({opacity:0.1, display:"inline-block"}).stop().animate({width:'show', opacity:1.0}, 'fast');
		}	
		else {
			if($("#imageDel"+num).css('display')!='none') {
				$("#image"+num).attr("src", "../common/img/blank.gif");
				$("#image"+num).css({'width':'1'});
				$("#imageDel"+num).animate({width:'hide'}, 'fast');
				$("form[name=cateForm] input[name=image" + num + "]").val();
			}
		}
	}

	function getCateInfo(cate) {
		if(!cate) return;
		
		var data = new FormData();
		data.append('cate', cate);

		$.ajax({
				url: 'cate_info_json.php', 
				type: 'POST',
				data: data, 
				cache: false,
				dataType: 'json',
				processData: false, 
				contentType: false, 
				success: function(data, textStatus, jqXHR) {					
					if(typeof(data.error) === 'undefined') {						
						$.each(data, function(key, value) {
							$("form[name=cateForm] input[name=cate_name]").val(data[key].name);
							$("form[name=cateForm] input:radio[name=used]:input[value="+data[key].used+"]").prop('checked', true);
							$("form[name=cateForm] input:radio[name=access_type]:input[value="+data[key].access_type+"]").prop('checked', true);							

							if(data[key].parent_used=='0') $("form[name=cateForm] input:radio[name=used]:input[value=1]").prop('disabled', true);
							else $("form[name=cateForm] input:radio[name=used]:input[value=1]").prop('disabled', false);

							accessType();
							accessLevel(data[key].access_level) ;
							putImage(1, data[key].image1, data[key].img_size1);
							putImage(2, data[key].image2, data[key].img_size1);
							putImage(3, data[key].image3, data[key].img_size1);

							$('#cate_image1').html(data[key].cate_image1_help);
							$('#cate_image2').html(data[key].cate_image2_help);
							$('#cate_image3').html(data[key].cate_image3_help);
						});

						getCateSubInfo(cate);
					}
					else {
						alertify.error(data.error);
					}
				},
				error: function(jqXHR, textStatus, errorThrown) {
					alertify.error(textStatus);
				}		
			});
	}

	function getCateSubInfo(cate) {
		if(!cate) return;

		var data = new FormData();
		data.append('cate', cate);
		
		$.ajax({
				url: 'cate_sub_info_json.php', 
				type: 'POST',
				data: data, 
				cache: false,
				dataType: 'json',
				processData: false, 
				contentType: false, 
				success: function(data, textStatus, jqXHR) {					
					if(typeof(data.error) === 'undefined') {
						var insertCode = '';
						var num = parseInt($("form[name=cateForm] input[name=cate_dep]").val()) + 1;
						var ck = 0;

						$.each(data, function(key, value) {
							insertCode =  '<li class="cateItem' + num + '" id="' + data[key].id + '" data-idx="' + data[key].id + '">' + data[key].name + '</li>';
							$('#cateSortable'+num).append(insertCode);
							ck = 1;
						});

						if(ck==0) {
							$('#unLink'+num).html('<i class="xi-close"></i>').fadeIn(100);
							for(i=num+1;i<5; i++) {
								$('#unLink'+i).html('<i class="fas fa-unlink"></i>');
							}	
						}
						else {
							$('#unLink'+num).fadeOut(100);
						}

						cateClickSet(num);
						cateSortable(num);
					}
					else {
						alertify.error(data.error);
					}
				},
				error: function(jqXHR, textStatus, errorThrown) {
					alertify.error(textStatus);
				}		
			});

	}

	function cateClickSet(num) {
		$('.cateItem'+num).unbind('mousedown').bind('mousedown', function(e){
			var cate_name	= '';
			var idx			= $(this).attr('data-idx');
			$("form[name=cateForm] input[name=cate]").val(idx);
			$("form[name=cateForm] input[name=cate_dep]").val(num);
			
			$('.cateItem'+num).removeClass('select');
			$(this).addClass('select');
		
			$("form[name=cateForm] input[name=cate_location_name" + num + "]").val(str_replace("→","",$(this).html()));
			
			for(i= 1 ; i <= num; i ++) {
				if(i==1) cate_name = $("form[name=cateForm] input[name=cate_location_name" + i + "]").val();
				else cate_name +=  " > " + $("form[name=cateForm] input[name=cate_location_name" + i + "]").val();
			}
			$('#cateLocation').html(cate_name + ' (분류코드:' + $("form[name=cateForm] input[name=cate]").val() + ')');

			$("form[name=cateForm] input[name=mode]").val("modify");
			$('#cateRelease').fadeIn('200');

			if(num==4) $("#cateWrite").fadeOut('200');
			else $("#cateWrite").fadeIn('200');

			$("#cateMod").fadeIn('200');
			$("#cateDel").fadeIn('200');
			$("form[name=cateForm] input:radio[name=type]:input[value=1]").prop('checked', true);
		
			for(i=(num+1);i<5; i++) {
				$('#cateSortable'+i).html('');
			}			
			getCateInfo($("form[name=cateForm] input[name=cate]").val());
			
		});
	}

	function cateSortable(num) {
		$('#cateSortable'+num).sortable({
			placeholder: "highlight",
			cursor : "move",
			update : function(e, ui) {
				$('form[name=cateForm] input[name=cate_order'+num+']').val($(this).sortable("toArray", { attribute : 'data-idx'}));				

				var data = new FormData();
				data.append('dep', num);
				data.append('order', $('form[name=cateForm] input[name=cate_order'+num+']').val());
				
				$.ajax({
					url: 'cate_sort_json.php', 
					type: 'POST',
					data: data, 
					cache: false,
					dataType: 'json',
					processData: false, 
					contentType: false, 
					success: function(data, textStatus, jqXHR) {
						if(typeof(data.error) === 'undefined') {						
							alertify.success(data.success);
						}
						else {
							alertify.error(data.error);
						}
					},
					error: function(jqXHR, textStatus, errorThrown) {
						alertify.error(textStatus);
					}		
				});
			}
		});

		$('form[name=cateForm] input[name=cate_order'+num+']').val($('#cateSortable'+num).sortable("toArray", { attribute : 'data-idx'}));
	}


	$(function() {

		var insertCode = '';
		for(i=0,cnt=CATEname.length;i<cnt;i++){			
			insertCode	=  '<li class="cateItem1" id="'+CATEnum[i][0]+'" data-idx="'+CATEnum[i][0]+'">'+CATEname[i][0]+'</li>';
			$('#cateSortable1').append(insertCode);
		}
		
		cateClickSet(1);
		cateSortable(1);		

		$('#cateRelease').on('click', function(e){
			$("form[name=cateForm] input[name=cate]").val('');
			$("form[name=cateForm] input[name=cate_dep]").val(1);
			$('#cateSortable2').html('');
			$('#cateSortable3').html('');
			$('#cateSortable4').html('');
			$('#cateLocation').html('없음');
			$('.cateItem1').removeClass('select');			
			$('#cateRelease').hide();
			$("form[name=cateForm] input:radio[name=type]:input[value=0]").prop('checked', true);
			$("#cateMod").fadeOut(200);
			$("#cateDel").fadeOut(200);
			cateDefault();
			
			for(i=2;i<5; i++) {
				$('#unLink'+i).html('<i class="fas fa-unlink"></i>').fadeIn(100);;			
			}	
		});
		
		$(".content input:radio[name=type]").on('click', function(e){
			if($(this).val()=='0'){
				$("form[name=cateForm] input[name=mode]").val("write");
				cateDefault();
			}
			else if($(this).val()=='1'){
				$("form[name=cateForm] input[name=mode]").val("modify");
				$('#cateSortable' + (parseInt($("form[name=cateForm] input[name=cate_dep]").val()) + 1)).html('');
				getCateInfo($("form[name=cateForm] input[name=cate]").val());				
			}
			else if($(this).val()=='2'){
				alertify.alert("분류삭제시 복구가 되지 않습니다. 주의 하시기 바랍니다.");
				$("form[name=cateForm] input[name=mode]").val("delete");
				$('#cateSortable' + (parseInt($("form[name=cateForm] input[name=cate_dep]").val()) + 1)).html('');
				getCateInfo($("form[name=cateForm] input[name=cate]").val());				
			}
		});
		
		$('.imageBtn').on('change', function(e){		

			if(!CommonCheckImage($(this))) return;

			if(e.target.files[0]) {
				var num = $(this).attr("num");
				var reader = new FileReader();
				reader.onload = function (e) {
					var image = new Image();
					image.src = e.target.result;

					image.onload = function(){                             
						$("#image"+num).attr("src", this.src);

						if(parseInt($("#imgWidth").css('width')) < parseInt(this.width)) {
							$("#image"+num).css({'width':'95%'});
						}
						else $("#image"+num).css({'width':this.width});

						$("#imageDel"+num).css({opacity:0.1, display:"inline-block"}).stop().animate({width:'show', opacity:1.0}, 'fast');
			        };                      
				}
				reader.readAsDataURL(e.target.files[0]);
			}
		});

		$('.filedel-button').on('click', function(e){		
			var num = str_replace("imageDel","",this.id);
			$("#image"+num).attr("src", "../common/img/blank.gif");
			$("#image"+num).css({'width':'1'});
			$("#imageDel"+num).animate({width:'hide'}, 'fast');
			if($("form[name=cateForm] input:radio[name=type]:checked").val()=='1') {
				$("form[name=cateForm] input[name=img_del" + num + "]").val(1);
			}
		});
		
		accessType();
		
	});

//-->
</script>
