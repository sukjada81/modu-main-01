			<td style="text-align:left">
				<div id="name_{{UID}}" data-name='{{NAME}}'><a href="goods_info.php?mode=modify&uid={{UID}}{{addstring}}" title="상품정보수정"  class="underLine" target="_blank">{{NAME}}<a></div>

		<!-- DYNAMIC @empty_list@ -->

			<td colspan="9" class="emptyList"><i class="fas fa-quote-left"></i>&nbsp;&nbsp;등록된 상품이 없습니다!&nbsp;&nbsp;<i class="fas fa-quote-right"></i></td>

		<div class="moveBox">
			<div class="moveBoxIn">
				<form name="moveForm">
					<input type="text" class="js-range-slider" name="move" value="" />

	<div class="listSelectB size09">
		<form name='modifyForm2' method="get" action='{{PHP_SELF}}' />
		<div class="firstLine" style="padding-left:0">			
			<select name="exhibition">
				<option value="">선택</option>
				<!-- DYNAMIC @loop_exhibition2@ -->
				<option value="{{exhibition_uid}}">{{exhibition_name}}</option>
				<!-- DYNAMIC @loop_exhibition2@ -->
			</select>		
			<script>
				$("form[name=modifyForm2] select[name='exhibition']").val('{{exhibition}}').heapbox({'width' : '500px', 'onChange':function(value) { changeSL(1); } });
			</script>
		</div>
		<!-- DYNAMIC @is_cate2@ -->
		<div class="line">
			<select name="cate">					
				<!-- DYNAMIC @loop_cate2@ -->
				<option value="{{cate_num}}">{{cate_name}}</option>
				<!-- DYNAMIC @loop_cate2@ -->
			</select>			
			<script>
				$("form[name=modifyForm2] select[name='cate']").val('{{cate}}').heapbox({'width' : '240px', 'zindex':6, 'onChange':function(value) { changeSL(2); } });

<script src="../../lib/ion.rangeSlider.js?ver={{ver}}"></script>
<script>
<!--

	function changeSL(num) {		
		if(!num) return;
		$("form[name=modifyForm"+num+"]").submit();
	}

	var ckAnimateLoop = 0;
	function animateLoop() {
		if(ckAnimateLoop == 0) {
			$('.move-arrow').animate({left:'8px'}, "fast").animate({left:'3px'}, "fast", animateLoop);
		}
		else {
			$('.move-arrow').finish().css({left:'5px'});
		}
	}
	
	var sec_obj = null;
	function targetHover() {
		$('#goodsSortable').find('.target').hover(function(e){
			var self = this;

			$(this).find('td').each(function(){
				$(this).css({'width':$(this).css('width')});

			});					
			
			$('form[name=moveForm] input[name=move_idx]').val($(this).attr('data-idx'));
			var position = $(this).position();
			var position2 = $(this).find('td:nth-child(5)').position();
			if(sec_obj != this) {	
				let my_range = $(".js-range-slider").data("ionRangeSlider");
				my_range.update({
					from: $(self).find('td:nth-child(1)').text()
				});
				my_range.reset();
			}

			sec_obj = this;
			
			total = parseInt(str_replace(",","",$('#total_cnt').html()));
			if(total > 10) $(".moveBox").css({'top':position.top + 1, left: position2.left - parseInt($('.moveBox').css('width')) - 2}).stop().fadeIn();
		}, 
		function() {
			$(".moveBox").stop().fadeOut();
		});
	}

	function itemDel(uid) {
		if(!uid) return;

		var obj = null;

		$('#goodsSortable').find('.target').each(function(i){
			if($(this).attr('data-idx') == uid) {
				obj = this;					
			}
		});
		
		name = $('#name_' + uid).attr('data-name');
		$(obj).remove();
		$('#goodsSortable').find('tbody').sortable("refresh");
		$('form[name=listForm] input[name=list_order]').val($('#goodsSortable').find('tbody').sortable("toArray", { attribute : 'data-idx' }));
		$('#goodsSortable').find('tbody tr td:nth-child(1)').text(function() {
			return $(this).parent().index('#goodsSortable tbody tr');
		});			
		$(".moveBox").hide();
		var total = parseInt(str_replace(",","",$('#total_cnt').html())) - 1;
		$('#total_cnt').html(number_format(total))

		let my_range = $(".js-range-slider").data("ionRangeSlider");
		my_range.update({
			max: total
		});
		my_range.reset();
		
		$('#goodsSortable').find('.target').unbind('hover');
		targetHover();
		
		itemPost(uid, 'delete', name + ' 상품이 모음전에서 해제 되었습니다.');
		
		if(!$('form[name=listForm] input[name=list_order]').val()) {
			$('#goodsSortable').find('tbody').append('<tr><td colspan="9" class="emptyList"><i class="fas fa-quote-left"></i>&nbsp;&nbsp;등록된 상품이 없습니다!&nbsp;&nbsp;<i class="fas fa-quote-right"></i></td></tr>');
		}
	}

	function itemInsert(uid, image, name, cate, price, display_use, sale_use, qty_type) {
		
		if($('.emptyList').length > 0) $('.emptyList').remove();

		var total = parseInt(str_replace(",","",$('#total_cnt').html())) + 1;
		$('#total_cnt').html(number_format(total))

		var html = '<tr data-idx="' + uid + '" class="target">\
						<td style="width:6%">' + number_format(total) + '</td>\
						<td style="width:7%">' + uid + '</td>\
						<td style="width:6%"><img src="' + image + '" alt="' + name + ' 이미지" width="50" /></td>\
						<td style="text-align:left;width:45%">\
							<div id="name_' + uid + '">' + name + '</div>\
							<div class="size08" style="padding-top:8px;">' + cate + '</div>\
						</td>\
						<td style="width:10%">' + price + '원</td>\
						<td style="width:6%">' + display_use + '</td>\
						<td style="width:6%">' + sale_use + '</td>\
						<td style="width:8%">' + qty_type + '</td>\
						<td style="width:6%"><i class="xi-close-thin masterTooltip" title="해제하기" onclick="itemDel(\'' + uid + '\'); return false;"></i></td>\
					</tr>';
		$('#goodsSortable').find('tbody').append(html);

		let my_range = $(".js-range-slider").data("ionRangeSlider");
		my_range.update({
			max: total
		});
		my_range.reset();
		
		resetTooltip();
		targetHover();

		itemPost(uid, 'insert', name + ' 상품이 모음전에 등록 되었습니다.');
	}

	function itemPost(uid, mode, msg, goods_order) {
		var data = new FormData();

		data.append('uid', uid);
		data.append('mode', mode);
		data.append('exhibition', '{{exhibition}}');
		data.append('cate', '{{cate}}');
		data.append('goods_order', goods_order);

		$.ajax({
			url: 'exhibition_goods_post_json.php', 
			type: 'POST',	
			data: data, 
			cache: false,
			dataType: 'json',
			processData: false, 
			contentType: false, 
			success: function(data, textStatus, jqXHR) {
				if(typeof(data.error) === 'undefined') {											
					alertify.success(msg);
				}
				else {
					alertify.error(data.error);
				}
			},
			error: function(jqXHR, textStatus, errorThrown) {
				alertify.error(textStatus);
			}		
		});

	}

	function exhibitionGet(uid) {

		alertify.closeAll('iframeDialog');

		var data = new FormData();

		data.append('uid',uid);

		$.ajax({
			url: 'goods_info_json.php', 
			type: 'POST',	
			data: data, 
			cache: false,
			dataType: 'json',
			processData: false, 
			contentType: false, 
			success: function(data, textStatus, jqXHR) {
				if(typeof(data.error) === 'undefined') {											
					$.each(data, function(key, value) {
						itemInsert(data[key].uid, data[key].image, data[key].name, data[key].cate, data[key].price, data[key].display_use, data[key].sale_use, data[key].qty_type);
					});				
				}
				else {
					alertify.error(data.error);
				}
			},
			error: function(jqXHR, textStatus, errorThrown) {
				alertify.error(textStatus);
			}		
		});
	}
	
	$(function() {		
		
		$('.listSelectRB').html($('.listSelectR').html());
		
		$(".js-range-slider").ionRangeSlider({      
			min: 1,
			max: {{TOTAL}},
			grid: true,
			grid_num : 5
		});
		
		targetHover();
	
		$(".moveBox").hover(function(e){	
			total = parseInt(str_replace(",","",$('#total_cnt').html()));
			if(total > 10) $(".moveBox").stop().fadeIn();
		},
		function() {
			$(".moveBox").stop().fadeOut();
		});

		$('.moveArrow').hover(function(e){	
			ckAnimateLoop = 0;
			animateLoop();
		},
		function() {
			ckAnimateLoop = 1;	
		});
		
		$('.btnGSearch').click(function(e){
			iframeView("popup_goods_search.php?type=exhibition&type2={{exhibition}}", "상품검색");
		});
		
		$('.moveArrow').on('click', function(e){
			var obj1 = null;
			var obj2 = null;

			$('#goodsSortable').find('.target').each(function(i){
				if($(this).attr('data-idx') == $('form[name=moveForm] input[name=move_idx]').val()) {
					obj1 = this;					
				}
				if($('form[name=moveForm] input[name=move]').val() == (i+1)) {
					obj2 = this;					
				}
			});

			if(obj1 == obj2) return;

			$(obj1).remove();
			$(obj2).before(obj1);
			$('#goodsSortable').find('tbody').sortable("refresh");
			$('form[name=listForm] input[name=list_order]').val($('#goodsSortable').find('tbody').sortable("toArray", { attribute : 'data-idx' }));
			$('#goodsSortable').find('tbody tr td:nth-child(1)').text(function() {
				return $(this).parent().index('#goodsSortable tbody tr');
			});			
			$(".moveBox").hide();

			$('#goodsSortable').find('.target').unbind('hover');
			targetHover();

			itemPost('', 'order', '모음전 순서가 저장 되었습니다.', $('form[name=listForm] input[name=list_order]').val());

		});
		
		$('#goodsSortable').find('tbody').sortable({
			placeholder: "highlight",
			items: ".target",
			cursor : "move",
			update : function(e, ui) {
				$('form[name=listForm] input[name=list_order]').val($(this).sortable("toArray", { attribute : 'data-idx' }));
				$('#goodsSortable').find('tbody tr td:nth-child(1)').text(function() {
					return $(this).parent().index('#goodsSortable tbody tr');
				});
				
				var position = ui.item.position();
				
				let my_range = $(".js-range-slider").data("ionRangeSlider");
				my_range.update({
					from: ui.item.find('td:nth-child(1)').text()
				});
				my_range.reset();

				total = parseInt(str_replace(",","",$('#total_cnt').html()));
				if(total > 10) $(".moveBox").css({'top':position.top + 1}).stop().fadeIn();

				itemPost('', 'order', '모음전 순서가 저장 되었습니다.', $('form[name=listForm] input[name=list_order]').val());
			}
		});

		$('form[name=listForm] input[name=list_order]').val($('#goodsSortable').find('tbody').sortable("toArray", { attribute : 'data-idx' }));			
	});	

//-->
</script>
