	$(function() {
		
		if($("form[name=searchForm] input[name='keyword']").val().length) $(".resetIconBtn").show();

		$('.listSelectB').html($('.listSelect').html());
			
		$('.expensionArrow').hover(function(e) {
			ckAnimateLoop1 = 0;
			animateLoop1();
		}, 
		function() {
			ckAnimateLoop1 = 1;	
		});

		$('.expensionArrow').click(function(e) {
			if($('.box_down').hasClass("rotate180")) {
				$('.box_down').removeClass('rotate180');
				$('.box_down').addClass('rotate180r');
				$('.box').animate({height:'4px'}, "fast");
				$('.searchDetail').slideUp('fast');
			}
			else {
				$('.box_down').removeClass('rotate180r');
				$('.box_down').addClass('rotate180');
				$('.box').animate({height:'34px'}, "fast");
				$('.searchDetail').slideDown('fast');
			}			
		});

		$('.btns2').click(function(e){
			$("form[name=searchForm] input[name='s_date']").val($(this).attr('data-s_date'));
			$("form[name=searchForm] input[name='e_date']").val($(this).attr('data-e_date'));			
			return;
		});

		$('.secGet').click(function(e) {
			var ret = [];
			$("form[name=listForm] input[name='item[]']:checkbox:checked").each(function(i) {
				ret.push($(this).val());
			});
			
			if(ret.length==0) {
				alertify.alert("선택된 상품이 없습니다.")
				return;
			}
			{{type}}Get(ret);						
			return;

		});

		$('.ckeckItem').click(function(e) {
			if($("form[name=listForm] input[name='multi']").val()=='0') {
				$("form[name=listForm] input[name='item[]']:checkbox:checked").each(function(i) {
					$(this).prop("checked",false);
				});
				$(this).prop("checked",true);
			}
		});

		<!-- DYNAMIC @is_search_open1@ -->
		$('.expensionArrow').trigger('click');
