<script>

	var vendorCommi			=  { {{vendor_commission}} };
	var goods_price_limit1  = '{{goods_price_limit1}}';
	var goods_price_limit2  = '{{goods_price_limit2}}';


	function commissionChange(uid) {
		var vendor = $('form[name=listForm] input[name=vendor_'+uid+']').val();
		if(!vendor) return;
		if($('form[name=listForm] input[name=commission_type_'+uid+']').val()==0) {
			$('form[name=listForm] input[name=commission_'+uid+']').val(vendorCommi[vendor]);
			$('#commi_individual_'+uid).show();
			$('#commi_public_'+uid).hide();
		}
		else {
			$('form[name=listForm] input[name=commission_'+uid+']').attr('readonly',false).removeClass('darks');	
			$('#commi_individual_'+uid).hide();
			$('#commi_public_'+uid).show();
		}
		//$('form[name=listForm] input[name=orig_price_'+uid+']').attr('readonly',true).addClass('darks');		
	}

	function vendorPrice(uid, price2) {
		var commission = $('form[name=listForm] input[name=commission_' + uid + ']').val();
		if(price2) 	{
			var price2 = parseInt(str_replace(",", "", price2));
			if(price2 > 0) {			
				var price = (price2 * 100) / (100 - commission);
				price = priceLimit2(price);
				$('form[name=listForm] input[name=price_' + uid + ']').val(number_format(price));			
			}
		}
		else {		
			var price = parseInt(str_replace(",","",$('form[name=listForm] input[name=price_' + uid + ']').val()));			
			if(price > 0) {				
				var orig_price = price * ((100 - commission) / 100);
				orig_price = priceLimit2(orig_price);
				$('form[name=listForm] input[name=orig_price_' + uid + ']').val(number_format(orig_price));
			}
		}
	}

	function hqPrice(uid) {
		var price1 = parseInt(str_replace(",","",$('form[name=listForm] input[name=price_'+uid+']').val()));		

		if(price1 > 0) {
			var price2 = parseInt(str_replace(",","",$('form[name=listForm] input[name=orig_price_'+uid+']').val()));
			var margin_won = number_format(price1 - price2);
			var margin = number_format(((price1 - price2) * 100) / price1, 2);
			$('form[name=listForm] input[name=commission_'+uid+']').val(margin);
		}
	}

	function qtyChange(uid) {
		if($('form[name=listForm] input[name=qty_type_'+uid+']').val()==1) {			
			qtyClick(uid);
		}
	}

	function qtyClick(uid) {
		var ckLimit = $('form[name=listForm] input[name=qty_type_'+uid+']');
		var ckQty	= $('form[name=listForm] input[name=qty_'+uid+']');
		var $v = $('#qty_type_'+uid); 
		if($v.hasClass('colorOrange')) {					
			ckLimit.val('0');
			ckQty.attr('readonly',false);
			ckQty.removeClass('darks');
			$v.removeClass('colorOrange');
		}
		else {
			ckLimit.val('1');
			ckQty.attr('readonly',true);					
			ckQty.addClass('darks');
			$v.addClass('colorOrange');					
		}
	}	

//-->
</script>

	function timelinyResetCallBackSub() {

		$('.only_num_jum').unbind('keypress').bind('keypress',function(event) {
			if(event.which && (event.which < 46 || event.which > 57) ) {
				event.preventDefault();
			}		
		}).unbind('keyup').bind('keyup',function(e) {
			if( $(this).val() != null && $(this).val() != '' ) {
				$(this).val( $(this).val().replace(/[^0-9.]/g, '') );
			}
		});

		$('.only_num_format').unbind('keyup').bind('keyup',function(e) {
			var position = $(this).caret();
			var length	 = $(this).val().length;
			if(jQuery.trim($(this).val()) != null && jQuery.trim($(this).val()) != '' ) {
				$(this).val($(this).val().replace(/[^0-9]/g, '').replace(/(\d)(?=(?:\d{3})+(?!\d))/g, '$1,'));
				if(length!=$(this).val().length) $(this).caret(position+1);
				else $(this).caret(position);
			}		
		});

		$('.price').unbind('blur').bind('blur',function(e) {
			var uid = $(this).attr('data-uid');
			var vendor = $('form[name=listForm] input[name=vendor_'+uid+']').val();
			
			$(this).val(priceLimit($(this).val()));		
			
			if(vendor) vendorPrice(uid);
			else hqPrice(uid);
		});

		$('.orig_price').unbind('blur').bind('blur',function(e) {
			var uid = $(this).attr('data-uid');
			var vendor = $('form[name=listForm] input[name=vendor_'+uid+']').val();
			
			$(this).val(priceLimit($(this).val()));		
			
			if(vendor) vendorPrice(uid, $(this).val());
			else hqPrice(uid);
		});

		$('.commission').unbind('blur').bind('blur',function(e) {
			if(!$(this).val()) $(this).val('0');
			$(this).val( parseFloat($(this).val()).toFixed(2) );

			var uid = $(this).attr('data-uid');
			var vendor = $('form[name=listForm] input[name=vendor_'+uid+']').val();
			
			if(vendor) vendorPrice(uid);
			else hqPrice(uid);
		});

		$('.commi_individual').unbind('click').bind('click',function(e) {
			var uid = $(this).attr('data-uid');
			$("form[name=listForm] input[name='commission_"+uid+"']").attr('readonly',false).removeClass('darks');
			$("form[name=listForm] input[name='commission_type_"+uid+"']").val(1);
			$('#commi_individual_'+uid).hide();
			$('#commi_public_'+uid).show();
		});

		$('.commi_public').unbind('click').bind('click',function(e) {
			var uid		= $(this).attr('data-uid');
			var vendor	= $(this).attr('data-vendor');
			$("form[name=listForm] input[name='commission_"+uid+"']").val(vendorCommi[vendor]).attr('readonly',true).addClass('darks');
			$("form[name=listForm] input[name='commission_type_"+uid+"']").val(0);
			$('#commi_public_'+uid).hide();
			$('#commi_individual_'+uid).show();
			if(vendor) vendorPrice(uid);
		});
		
		$('.qty_type').unbind('click').bind('click',function(e) {
			var uid		= $(this).attr('data-uid');
			qtyClick(uid);
		});

		$('.btnSave').unbind('click').bind('click',function(e) {
			var uid		= $(this).attr('data-uid');
			if(!uid) return;
			var fieldArr = new Array('price','orig_price','commission_type','commission','consumer_price','qty_type','qty');

			$('form[name=saveForm] input[name=uid]').val(uid);		
			for(i=0, cnt=fieldArr.length; i<cnt; i++) {
				$('form[name=saveForm] input[name='+fieldArr[i]+']').val($('form[name=listForm] input[name='+fieldArr[i]+'_'+uid+']').val());
			}
			$('form[name=saveForm]').submit();
		});

		$('.btns2').unbind('click').bind('click',function(e) {

			return;
		});		
	}
